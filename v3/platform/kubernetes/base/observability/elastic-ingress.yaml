apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: elasticsearch
  namespace: elastic-stack
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`elasticsearch.observability.test`)
      services:
        - name: elasticsearch-vm
          port: 39200
          scheme: http
  tls:
    secretName: elastic-public-tls
---
