apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-vm
  namespace: elastic-stack
spec:
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: elasticsearch-vm-1
  namespace: elastic-stack
  labels:
    kubernetes.io/service-name: elasticsearch-vm
addressType: IPv4
ports:
  - name: http
    port: 9200
endpoints:
  - addresses: [192.168.33.30]
    conditions:
      ready: true
---
