apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-vm
  namespace: elastic-stack
spec:
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: Endpoints
metadata:
  name: elasticsearch-vm
  namespace: elastic-stack
subsets:
  - addresses:
      - ip: 192.168.33.30
    ports:
      - name: http
        port: 9200
---
