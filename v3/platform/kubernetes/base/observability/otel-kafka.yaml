---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: elastic-stack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-kafka-config
  namespace: elastic-stack
data:
  gateway.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        timeout: 1s
        send_batch_size: 512
    exporters:
      kafka/otlp:
        brokers: ["192.168.33.10:9092"]
        traces:
          topic: otel-traces
          encoding: otlp_proto
        metrics:
          topic: otel-metrics
          encoding: otlp_proto
        logs:
          topic: otel-logs
          encoding: otlp_proto
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [kafka/otlp]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [kafka/otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [kafka/otlp]

  daemonset.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog/kubernetes:
        include: [/var/log/pods/*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
          # Les applications Java écrivent un événement ECS JSON sur stdout.
          # On le décode ici afin que message, service et contexte de trace
          # soient indexés comme champs de log, au lieu de rester dans body.text.
          - type: json_parser
            parse_from: body
            parse_to: attributes
            if: 'body matches "^\\s*\\{"'
            body: attributes.message
            trace:
              trace_id:
                parse_from: attributes.trace_id
              span_id:
                parse_from: attributes.span_id
              trace_flags:
                parse_from: attributes.trace_flags
      hostmetrics:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          cpu: {}
          disk: {}
          filesystem: {}
          load: {}
          memory: {}
          network: {}
          paging: {}
          processes: {}
      prometheus/internal:
        config:
          scrape_configs:
            - job_name: otel-kubernetes
              scrape_interval: 15s
              static_configs:
                - targets: [127.0.0.1:8888]
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.container.name]
      batch:
        timeout: 1s
        send_batch_size: 512
    exporters:
      otlphttp/gateway:
        endpoint: http://otel-gateway.elastic-stack.svc.cluster.local:4318
    service:
      extensions: [health_check]
      telemetry:
        resource:
          service.name: otel-kubernetes
          deployment.environment.name: homologation
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          receivers: [filelog/kubernetes]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/gateway]
        metrics:
          receivers: [hostmetrics, prometheus/internal]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/gateway]

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-kubernetes
  namespace: elastic-stack
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: otel-kubernetes}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-kubernetes}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.4.3
          securityContext: {runAsUser: 0}
          args: ["--config=/etc/otel/daemonset.yaml"]
          ports:
            - {name: health, containerPort: 13133}
            - {name: metrics, containerPort: 8888}
          volumeMounts:
            - {name: config, mountPath: /etc/otel/daemonset.yaml, subPath: daemonset.yaml, readOnly: true}
            - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
            - {name: hostfs, mountPath: /hostfs, readOnly: true}
          readinessProbe: {httpGet: {path: /, port: health}}
          livenessProbe: {httpGet: {path: /, port: health}}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 1, memory: 768Mi}
      volumes:
        - name: config
          configMap: {name: otel-kafka-config}
        - name: varlogpods
          hostPath: {path: /var/log/pods}
        - name: hostfs
          hostPath: {path: /}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-gateway}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.4.3
          args: ["--config=/etc/otel/gateway.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          volumeMounts:
            - {name: config, mountPath: /etc/otel/gateway.yaml, subPath: gateway.yaml, readOnly: true}
          readinessProbe: {httpGet: {path: /, port: health}}
          livenessProbe: {httpGet: {path: /, port: health}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: otel-kafka-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: elastic-stack
spec:
  selector: {app.kubernetes.io/name: otel-gateway}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: otel-telemetry-topics-v3
  namespace: elastic-stack
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              for topic in otel-traces otel-metrics otel-logs; do
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server
              192.168.33.10:9092 --create --if-not-exists --topic "$topic"
              --partitions 3 --replication-factor 1
              --config min.insync.replicas=1;
              partitions=$(/opt/kafka/bin/kafka-topics.sh
              --bootstrap-server 192.168.33.10:9092 --describe --topic "$topic"
              | sed -n 's/.*PartitionCount: \([0-9][0-9]*\).*/\1/p' | head -1);
              if [ "${partitions:-0}" -lt 3 ]; then
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server
              192.168.33.10:9092 --alter --topic "$topic" --partitions 3;
              fi; done
