---
- name: Provisionner les nœuds de données du POC
  hosts: all
  become: true
  gather_facts: true

  vars:
    mongodb_primary_ip: 192.168.33.10
    postgresql_host: 192.168.33.10
    postgresql_database: observability_test
    postgresql_user: observability
    # Fourni par Vagrant depuis POSTGRESQL_PASSWORD ; ne jamais versionner la
    # valeur. Le même secret est injecté dans la policy Fleet par Kubernetes.
    postgresql_password: ""
    kafka_cluster_id: q1Sh-9_ISia_zwGINzRvyQ
    kafka_controller_voters: 1@192.168.33.10:9093
    otel_gateway_kafka_broker: 192.168.33.10:9092
    otel_kafka_broker: 192.168.33.10:9092
    deployment_profile: minimal
    elastic_agent_version: 9.4.3
    # Les VM s'enrôlent via le réseau privé directement exposé par Fleet
    # Server ; l'URL publique passe par l'Ingress Kubernetes et n'est pas
    # joignable depuis le réseau privé des VM.
    fleet_url: http://192.168.33.20:8220
    fleet_enrollment_token: ""
    # Les VM accèdent à Elasticsearch via l'Ingress Traefik, pas via le port
    # HTTP interne du service Kubernetes.
    # Le backend OTEL local utilise le listener HTTP du stack Quadlet ; les
    # agents et les clients externes passent par les URL publiques Traefik.
    elasticsearch_url: http://127.0.0.1:9200
    # Injectée au provisionnement depuis le Secret Kubernetes existant ; ne
    # jamais versionner cette clé API.
    otel_elasticsearch_api_key: ""
    elastic_password: ""
    redeploy_services: false
    # Contenu PEM du certificat racine Zscaler (ou proxy TLS d'entreprise
    # équivalent), fourni par Vagrant via ZSCALER_CA_CERT. Vide par défaut :
    # aucune confiance supplémentaire n'est installée sur une machine sans
    # interception TLS. Voir certs/README.md.
    zscaler_ca_cert_content: ""

  pre_tasks:
    - name: Vérifier les variables injectées par Vagrant
      ansible.builtin.assert:
        that:
          - node_id is defined
          - node_ip is defined
        fail_msg: Vagrant doit fournir node_id et node_ip au playbook.

    - name: Vérifier le mot de passe PostgreSQL sur data-01
      ansible.builtin.assert:
        that: postgresql_password | default('') | length > 0
        fail_msg: Définir POSTGRESQL_PASSWORD hors Git avant de provisionner data-01.

    # Doit précéder toute installation de paquet (dnf) et tout téléchargement
    # HTTPS (Jolokia, Elastic Agent) : ces opérations échouent avec une
    # erreur TLS si le trafic sortant de la VM est intercepté par Zscaler et
    # que son certificat racine n'est pas encore approuvé par le système.
    - name: Installer le certificat racine Zscaler si fourni
      ansible.builtin.copy:
        content: "{{ zscaler_ca_cert_content }}"
        dest: /etc/pki/ca-trust/source/anchors/zscaler-root-ca.crt
        mode: '0644'
      register: zscaler_ca
      when: zscaler_ca_cert_content | length > 0

    - name: Mettre à jour le magasin de confiance système pour Zscaler
      ansible.builtin.command: update-ca-trust extract
      when: zscaler_ca.changed | default(false)
      changed_when: true

    - name: Identifier l'interface du réseau privé VirtualBox
      ansible.builtin.shell: |
        ip -o -4 addr show | awk -v ip='{{ node_ip }}' '$4 ~ ("^" ip "/") { print $2; exit }'
      args:
        executable: /bin/bash
      register: private_network_device
      changed_when: false

    - name: Vérifier l'interface du réseau privé
      ansible.builtin.assert:
        that: private_network_device.stdout | length > 0
        fail_msg: "Interface portant {{ node_ip }} introuvable."

    # Vagrant peut créer le profil de l'interface host-only avec user_tmp_t.
    # NetworkManager refuse alors de le réécrire, même exécuté par root.
    - name: Restaurer le contexte SELinux des profils NetworkManager
      ansible.builtin.command: restorecon -RFv /etc/NetworkManager/system-connections
      register: networkmanager_restorecon
      changed_when: networkmanager_restorecon.stdout | length > 0

    - name: Lire le profil NetworkManager du réseau privé
      ansible.builtin.command: "nmcli -g GENERAL.CONNECTION device show {{ private_network_device.stdout }}"
      register: private_network_connection
      changed_when: false

    - name: Empêcher le réseau privé de devenir la route par défaut
      ansible.builtin.command: "nmcli connection modify {{ private_network_connection.stdout }} ipv4.never-default yes"
      changed_when: false

    - name: Réactiver le profil du réseau privé
      ansible.builtin.command: "nmcli connection up {{ private_network_connection.stdout }} ifname {{ private_network_device.stdout }}"
      changed_when: false

    - name: Identifier l'interface qui porte la route par défaut
      ansible.builtin.shell: "ip route show default | awk 'NR == 1 { print $5 }'"
      args:
        executable: /bin/bash
      register: default_network_device
      changed_when: false

    - name: Lire le profil NetworkManager de la route par défaut
      ansible.builtin.command: "nmcli -g GENERAL.CONNECTION device show {{ default_network_device.stdout }}"
      register: default_network_connection
      changed_when: false

    # Certaines images Vagrant reçoivent un serveur DNS DHCP invalide. La VM
    # doit pouvoir récupérer les images Podman et les artefacts Elastic lors du
    # premier provisionnement.
    - name: Configurer des résolveurs DNS fiables sur la route par défaut
      ansible.builtin.command: >-
        nmcli connection modify "{{ default_network_connection.stdout }}"
        ipv4.ignore-auto-dns yes ipv4.dns "1.1.1.1,8.8.8.8"
      changed_when: false

    - name: Appliquer la configuration DNS de la route par défaut
      ansible.builtin.command: "nmcli device reapply {{ default_network_device.stdout }}"
      changed_when: false

    # Cette étape doit rester avant tout téléchargement DNF : sur certaines
    # images Rocky, le réseau privé reçoit la route par défaut et le DNS DHCP
    # associé ne permet alors pas de résoudre les miroirs.
    - name: Inventorier les paquets déjà installés
      ansible.builtin.package_facts:
        manager: auto

    - name: Installer les dépendances système absentes
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop: [podman, curl, openssl, chrony, haproxy, policycoreutils-python-utils]
      when: item not in ansible_facts.packages

    - name: Collecter l'état des services
      ansible.builtin.service_facts:

    - name: Lire les ports SELinux autorisés pour HAProxy
      ansible.builtin.command:
        argv: [semanage, port, -l]
      register: haproxy_selinux_port_list
      changed_when: false

    - name: Autoriser HAProxy à écouter et joindre les ports OTLP avec SELinux
      ansible.builtin.command:
        argv:
          - semanage
          - port
          - -a
          - -t
          - http_port_t
          - -p
          - tcp
          - "{{ item }}"
      loop: [4317, 4318, 4319, 4320]
      register: haproxy_selinux_ports
      changed_when: haproxy_selinux_ports.rc == 0
      failed_when: >-
        haproxy_selinux_ports.rc != 0 and
        'already defined' not in (haproxy_selinux_ports.stderr | lower)
      when: item | string not in haproxy_selinux_port_list.stdout

    - name: Activer la synchronisation NTP des VM
      ansible.builtin.systemd_service:
        name: chronyd
        enabled: true
        state: started

    - name: Autoriser Chrony à corriger immédiatement les grands décalages
      ansible.builtin.lineinfile:
        path: /etc/chrony.conf
        regexp: '^makestep\\s+'
        line: 'makestep 1.0 -1'
      register: chrony_makestep_config

    - name: Redémarrer Chrony après une modification de sa stratégie de correction
      ansible.builtin.systemd_service:
        name: chronyd
        state: restarted
      when: chrony_makestep_config.changed

    - name: Corriger immédiatement un éventuel décalage d'horloge
      ansible.builtin.command: chronyc -a makestep
      register: chrony_step
      # chronyc retourne 0 même si aucun ajustement n'est nécessaire. L'agent
      # se recale seul avec Fleet ; ne pas provoquer de redémarrage à chaque
      # provisionnement.
      changed_when: false
      failed_when: false

    - name: Ouvrir les ports inter-nœuds si firewalld est actif
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ ([27017, 9092, 9093, 5432] if inventory_hostname == 'data-01' else []) + ([4317, 4318, 9200, 5601, 8220] if inventory_hostname == 'otel-01' else []) }}"
      when: ansible_facts.services['firewalld.service'].state | default('stopped') == 'running'

    - name: Installer la résolution POC dans /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: '# {mark} POC ELASTIC HOSTS'
        block: |
          192.168.33.1 kibana.observability.test elasticsearch.observability.test fleet.observability.test apm.observability.test

    - name: Lire le certificat TLS public Elasticsearch du POC
      ansible.builtin.shell: |
        openssl s_client -showcerts -connect elasticsearch.observability.test:443 \
          -servername elasticsearch.observability.test </dev/null 2>/dev/null |
        awk '/BEGIN CERTIFICATE/{found=1} found {print} /END CERTIFICATE/{exit}'
      args:
        executable: /bin/bash
      register: elasticsearch_public_certificate
      changed_when: false

    - name: Vérifier le certificat public Elasticsearch
      ansible.builtin.assert:
        that: "'BEGIN CERTIFICATE' in elasticsearch_public_certificate.stdout"
        fail_msg: Le certificat TLS de elasticsearch.observability.test est inaccessible.

    - name: Installer le certificat public dans le magasin de confiance système
      ansible.builtin.copy:
        content: "{{ elasticsearch_public_certificate.stdout }}\n"
        dest: /etc/pki/ca-trust/source/anchors/observability-elasticsearch.crt
        mode: '0644'
      register: elasticsearch_ca

    - name: Mettre à jour le magasin de confiance système
      ansible.builtin.command: update-ca-trust extract
      when: elasticsearch_ca.changed
      changed_when: true

  tasks:
    - name: Créer les répertoires de logs
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: /var/log/mongodb, mode: '0755' }
        - { path: /var/log/kafka, mode: '0777' }
        - { path: /var/log/postgresql, mode: '0777' }
      when: inventory_hostname == 'data-01'

    - name: Créer le fichier de log MongoDB accessible au conteneur
      ansible.builtin.file:
        path: /var/log/mongodb/mongod.log
        state: touch
        mode: '0666'
        modification_time: preserve
        access_time: preserve
      when: inventory_hostname == 'data-01'

    - name: Créer le répertoire Jolokia
      ansible.builtin.file:
        path: /opt/observability
        state: directory
        mode: '0755'

    - name: Créer le répertoire de configuration OpenTelemetry
      ansible.builtin.file:
        path: /etc/observability
        state: directory
        mode: '0755'

    - name: Créer le répertoire persistant de l'exporteur Kafka OTel
      ansible.builtin.file:
        path: /var/lib/observability/otel-kafka-exporter
        state: directory
        # L'image EDOT s'exécute avec l'utilisateur elastic-agent (1000).
        owner: '1000'
        group: '1000'
        mode: '0750'
      when: inventory_hostname == 'otel-01'

    - name: Créer le répertoire persistant d'Elasticsearch sur otel-01
      ansible.builtin.file:
        path: /var/lib/observability/elasticsearch
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0750'
      when: inventory_hostname == 'otel-01'

    - name: Créer le répertoire d'état Fleet persistant sur otel-01
      ansible.builtin.file:
        path: /var/lib/observability/fleet-server
        state: directory
        owner: root
        group: root
        mode: '0750'
      when: inventory_hostname == 'otel-01'

    - name: Déployer les identifiants Elasticsearch du stack Quadlet
      ansible.builtin.copy:
        content: "ELASTIC_PASSWORD={{ elastic_password }}\n"
        dest: /etc/observability/elasticsearch.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when: inventory_hostname == 'otel-01'

    - name: Vérifier la présence du token service Kibana
      ansible.builtin.stat:
        path: /etc/observability/kibana-service-token
      register: kibana_service_token_file
      when: inventory_hostname == 'otel-01'

    - name: Créer le token service Kibana
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_security/service/elastic/kibana/credential/token/kibana
        method: POST
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      register: kibana_service_token
      no_log: true
      when:
        - inventory_hostname == 'otel-01'
        - not kibana_service_token_file.stat.exists

    - name: Déployer le token service Kibana
      ansible.builtin.copy:
        content: "{{ kibana_service_token.json.token.value }}\n"
        dest: /etc/observability/kibana-service-token
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when:
        - inventory_hostname == 'otel-01'
        - not kibana_service_token_file.stat.exists

    - name: Lire le token service Kibana
      ansible.builtin.slurp:
        src: /etc/observability/kibana-service-token
      register: kibana_service_token_content
      no_log: true
      when: inventory_hostname == 'otel-01'

    - name: Vérifier la présence des clés de chiffrement Kibana
      ansible.builtin.stat:
        path: /etc/observability/kibana-encryption-keys
      register: kibana_encryption_keys_file
      when: inventory_hostname == 'otel-01'

    - name: Générer les clés de chiffrement Kibana
      ansible.builtin.shell: |
        printf '%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)"
      args:
        executable: /bin/bash
      register: kibana_encryption_keys
      changed_when: true
      no_log: true
      when:
        - inventory_hostname == 'otel-01'
        - not kibana_encryption_keys_file.stat.exists

    - name: Déployer les clés de chiffrement Kibana
      ansible.builtin.copy:
        content: "{{ kibana_encryption_keys.stdout }}\n"
        dest: /etc/observability/kibana-encryption-keys
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when:
        - inventory_hostname == 'otel-01'
        - not kibana_encryption_keys_file.stat.exists

    - name: Lire les clés de chiffrement Kibana
      ansible.builtin.slurp:
        src: /etc/observability/kibana-encryption-keys
      register: kibana_encryption_keys_content
      no_log: true
      when: inventory_hostname == 'otel-01'

    - name: Déployer les identifiants Kibana du stack Quadlet
      ansible.builtin.copy:
        content: "ELASTICSEARCH_SERVICEACCOUNTTOKEN={{ kibana_service_token_content.content | b64decode | trim }}\n"
        dest: /etc/observability/kibana.env
        owner: root
        group: root
        mode: '0600'
      register: kibana_credentials
      no_log: true
      when: inventory_hostname == 'otel-01'

    - name: Déployer la configuration Kibana/Fleet du stack Quadlet
      ansible.builtin.template:
        src: kibana.yml.j2
        dest: /etc/observability/kibana.yml
        mode: '0644'
      register: kibana_config
      no_log: true
      when: inventory_hostname == 'otel-01'

    - name: Créer le cache persistant des artefacts du POC
      ansible.builtin.file:
        path: /var/cache/observability
        state: directory
        mode: '0755'

    - name: Vérifier la présence de l'agent Jolokia
      ansible.builtin.stat:
        path: /opt/observability/jolokia-agent.jar
      register: jolokia_agent

    - name: Télécharger l'agent Jolokia pour Kafka s'il est absent
      ansible.builtin.get_url:
        url: https://repo1.maven.org/maven2/org/jolokia/jolokia-agent-jvm/2.2.0/jolokia-agent-jvm-2.2.0-javaagent.jar
        dest: /opt/observability/jolokia-agent.jar
        mode: '0644'
      when:
        - inventory_hostname == 'data-01'
        - not jolokia_agent.stat.exists

    - name: Déployer la configuration du Gateway OTLP sur otel-01
      ansible.builtin.template:
        src: otel-gateway.yaml.j2
        dest: /etc/observability/otel-gateway.yaml
        mode: '0644'
      register: otel_gateway_config
      when: inventory_hostname == 'otel-01'

    - name: Vérifier la clé API de l'exporteur Kafka OTel
      ansible.builtin.assert:
        that: otel_elasticsearch_api_key | length > 0
        fail_msg: OTEL_ELASTICSEARCH_API_KEY doit être injectée au provisionnement de otel-01.
      when:
        - inventory_hostname == 'otel-01'
        - otel_elasticsearch_api_key | length > 0

    - name: Vérifier le mot de passe Elasticsearch sur otel-01
      ansible.builtin.assert:
        that: elastic_password | length > 0
        fail_msg: ELASTIC_PASSWORD doit être injectée au provisionnement de otel-01.
      when: inventory_hostname == 'otel-01'

    - name: Déployer la configuration de l'exporteur Kafka OTel sur otel-01
      ansible.builtin.template:
        src: otel-kafka-exporter.yaml.j2
        dest: /etc/observability/otel-kafka-exporter.yaml
        mode: '0644'
      register: otel_kafka_exporter_config
      when: inventory_hostname == 'otel-01'

    - name: Injecter la clé API de l'exporteur Kafka OTel
      ansible.builtin.copy:
        content: "ELASTICSEARCH_API_KEY={{ otel_elasticsearch_api_key }}\n"
        dest: /etc/observability/otel-kafka-exporter.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
      register: otel_kafka_exporter_credentials
      when: inventory_hostname == 'otel-01'

    - name: Déployer la configuration HAProxy du Gateway OTLP sur otel-01
      ansible.builtin.template:
        src: haproxy-otel-gateway.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
        validate: haproxy -c -f %s
      register: haproxy_otel_gateway_config
      when: inventory_hostname == 'otel-01'

    - name: Créer le répertoire des overrides systemd HAProxy
      ansible.builtin.file:
        path: /etc/systemd/system/haproxy.service.d
        state: directory
        mode: '0755'
      when: inventory_hostname == 'otel-01'

    - name: Déployer le répertoire runtime du socket HAProxy
      ansible.builtin.template:
        src: haproxy-runtime-directory.conf.j2
        dest: /etc/systemd/system/haproxy.service.d/runtime-directory.conf
        mode: '0644'
      register: haproxy_systemd_override
      when: inventory_hostname == 'otel-01'

    - name: Déployer les unités Quadlet MongoDB et Kafka sur data-01
      ansible.builtin.template:
        src: "{{ item }}.container.j2"
        dest: "/etc/containers/systemd/{{ item }}.container"
        mode: '0644'
      loop: [observability-mongodb, observability-kafka]
      register: data_quadlet_units
      when: inventory_hostname == 'data-01'

    - name: Déployer les unités Quadlet des gateways OTEL sur otel-01
      ansible.builtin.template:
        src: "{{ item }}.container.j2"
        dest: "/etc/containers/systemd/{{ item }}.container"
        mode: '0644'
      loop: [observability-otel-gateway, observability-otel-kafka-exporter]
      register: otel_quadlet_units
      when: inventory_hostname == 'otel-01'

    - name: Déployer les unités Quadlet du stack Elastic sur otel-01
      ansible.builtin.template:
        src: "{{ item }}.container.j2"
        dest: "/etc/containers/systemd/{{ item }}.container"
        mode: '0644'
      loop: [observability-elasticsearch, observability-kibana, observability-fleet-server]
      register: elastic_quadlet_units
      when: inventory_hostname == 'otel-01'

    - name: Déployer l'unité Quadlet PostgreSQL sur data-01
      ansible.builtin.template:
        src: observability-postgresql.container.j2
        dest: /etc/containers/systemd/observability-postgresql.container
        mode: '0644'
      register: postgresql_quadlet_unit
      when: inventory_hostname == 'data-01'

    - name: Recharger systemd après les changements Quadlet
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        (data_quadlet_units.changed | default(false)) or
        (otel_quadlet_units.changed | default(false)) or
        (elastic_quadlet_units.changed | default(false)) or
        (kibana_config.changed | default(false)) or
        (postgresql_quadlet_unit.changed | default(false)) or
        (haproxy_systemd_override.changed | default(false))

    - name: Vérifier si Elastic Agent est déjà installé
      ansible.builtin.stat:
        path: /opt/Elastic/Agent/elastic-agent
      register: installed_elastic_agent
      when: inventory_hostname in ['data-01', 'otel-01']

    # Les artefacts de bootstrap ne servent plus une fois l'agent installé.
    # Les retirer préserve l'espace de la VM pour les images de collecte.
    - name: Retirer les artefacts temporaires Elastic Agent devenus inutiles
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/tmp/elastic-agent-{{ elastic_agent_version }}-linux-{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x86_64' }}"
        - /opt/observability/elastic-agent-package
      when:
        - inventory_hostname == 'data-01'
        - installed_elastic_agent.stat.exists

    # Podman laisse des répertoires de staging dans /var/tmp après un pull
    # interrompu. Les supprimer avant de démarrer le Gateway évite qu'une VM
    # au disque contraint boucle sur un téléchargement impossible.
    - name: Identifier les téléchargements Podman incomplets
      ansible.builtin.find:
        paths: /var/tmp
        patterns: container_images_storage*
        file_type: directory
        recurse: false
      register: podman_incomplete_pulls
      when: inventory_hostname in ['data-01', 'otel-01']

    - name: Retirer les téléchargements Podman incomplets
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ podman_incomplete_pulls.files | default([]) }}"
      when: inventory_hostname == 'data-01'

    - name: Retirer les gateways OTEL de data-01
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        enabled: false
        state: stopped
      loop: [observability-otel-gateway, observability-otel-kafka-exporter, haproxy]
      failed_when: false
      when: inventory_hostname == 'data-01'

    - name: Retirer les fichiers OTEL obsolètes de data-01
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/containers/systemd/observability-otel-gateway.container
        - /etc/containers/systemd/observability-otel-kafka-exporter.container
        - /etc/observability/otel-gateway.yaml
        - /etc/observability/otel-kafka-exporter.yaml
        - /etc/observability/otel-kafka-exporter.env
        - /etc/haproxy/haproxy.cfg
      when: inventory_hostname == 'data-01'

    - name: Démarrer MongoDB et Kafka sur data-01
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        enabled: true
        state: started
      loop: [observability-mongodb, observability-kafka]
      when: inventory_hostname == 'data-01'

    - name: Démarrer les gateways OTEL sur otel-01
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        enabled: true
        state: started
      loop: [observability-otel-gateway, observability-otel-kafka-exporter]
      when: inventory_hostname == 'otel-01'

    - name: Démarrer Elasticsearch sur otel-01
      ansible.builtin.systemd_service:
        name: observability-elasticsearch.service
        enabled: true
        state: started
      when: inventory_hostname == 'otel-01'

    - name: Attendre Elasticsearch local sur otel-01
      ansible.builtin.uri:
        url: http://127.0.0.1:9200
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: 200
      register: elasticsearch_local_health
      retries: 30
      delay: 2
      until: elasticsearch_local_health.status == 200
      changed_when: false
      when: inventory_hostname == 'otel-01'

    - name: Vérifier la présence du token service Fleet Server
      ansible.builtin.stat:
        path: /etc/observability/fleet-server.env
      register: fleet_server_env
      when: inventory_hostname == 'otel-01'

    - name: Créer le token service Fleet Server
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_security/service/elastic/fleet-server/credential/token/fleet-server
        method: POST
        url_username: elastic
        url_password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      register: fleet_service_token
      no_log: true
      when:
        - inventory_hostname == 'otel-01'
        - not fleet_server_env.stat.exists

    - name: Lire le token service Fleet Server existant
      ansible.builtin.shell: >-
        awk -F= '/^FLEET_SERVER_SERVICE_TOKEN=/{print substr($0,index($0,"=")+1)}'
        /etc/observability/fleet-server.env
      args:
        executable: /bin/bash
      register: fleet_server_existing_token
      changed_when: false
      no_log: true
      when:
        - inventory_hostname == 'otel-01'
        - fleet_server_env.stat.exists

    - name: Sélectionner le token service Fleet Server
      ansible.builtin.set_fact:
        fleet_server_service_token: >-
          {{ fleet_service_token.json.token.value if fleet_service_token.json is defined
             else fleet_server_existing_token.stdout }}
      no_log: true
      when: inventory_hostname == 'otel-01'

    - name: Déployer la configuration du Fleet Server Quadlet
      ansible.builtin.copy:
        content: |
          FLEET_SERVER_SERVICE_TOKEN={{ fleet_server_service_token }}
          FLEET_SERVER_ELASTICSEARCH_USERNAME=elastic
          FLEET_SERVER_ELASTICSEARCH_PASSWORD={{ elastic_password }}
          KIBANA_FLEET_USERNAME=elastic
          KIBANA_FLEET_PASSWORD={{ elastic_password }}
        dest: /etc/observability/fleet-server.env
        owner: root
        group: root
        mode: '0600'
      register: fleet_server_env_config
      no_log: true
      when:
        - inventory_hostname == 'otel-01'

    - name: Démarrer Kibana et Fleet Server sur otel-01
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        enabled: true
        state: started
      loop: [observability-kibana, observability-fleet-server]
      when: inventory_hostname == 'otel-01'

    - name: Redémarrer Fleet Server après une modification de sa configuration
      ansible.builtin.systemd_service:
        name: observability-fleet-server.service
        state: restarted
      when:
        - inventory_hostname == 'otel-01'
        - fleet_server_env_config.changed | default(false)

    - name: Redémarrer Kibana après une modification de sa configuration
      ansible.builtin.systemd_service:
        name: observability-kibana.service
        state: restarted
      when:
        - inventory_hostname == 'otel-01'
        - kibana_config.changed or kibana_credentials.changed

    - name: Démarrer PostgreSQL sur data-01
      ansible.builtin.systemd_service:
        name: observability-postgresql.service
        enabled: true
        state: started
      when: inventory_hostname == 'data-01'

    - name: Redéployer MongoDB et Kafka après un changement ou sur demande
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: restarted
      loop: [observability-mongodb, observability-kafka]
      when: inventory_hostname == 'data-01' and ((data_quadlet_units.changed | default(false)) or (redeploy_services | bool))

    - name: Redéployer les gateways OTEL après un changement ou sur demande
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: restarted
      loop: [observability-otel-gateway, observability-otel-kafka-exporter]
      when: inventory_hostname == 'otel-01' and ((otel_quadlet_units.changed | default(false)) or (redeploy_services | bool))

    - name: Redémarrer le Gateway OTLP après une modification de sa configuration
      ansible.builtin.systemd_service:
        name: observability-otel-gateway.service
        state: restarted
      when: inventory_hostname == 'otel-01' and otel_gateway_config.changed and not (otel_quadlet_units.changed | default(false))

    - name: Redémarrer l'exporteur Kafka OTel après une modification de sa configuration
      ansible.builtin.systemd_service:
        name: observability-otel-kafka-exporter.service
        state: restarted
      when: >-
        inventory_hostname == 'otel-01' and
        not (otel_quadlet_units.changed | default(false)) and
        (otel_kafka_exporter_config.changed or otel_kafka_exporter_credentials.changed)

    - name: Démarrer HAProxy devant le Gateway OTLP sur otel-01
      ansible.builtin.systemd_service:
        name: haproxy.service
        enabled: true
        state: "{{ 'restarted' if haproxy_otel_gateway_config.changed else 'started' }}"
      when: inventory_hostname == 'otel-01'

    - name: Redéployer PostgreSQL après un changement ou sur demande
      ansible.builtin.systemd_service:
        name: observability-postgresql.service
        state: restarted
      when: inventory_hostname == 'data-01' and (postgresql_quadlet_unit.changed | default(false) or (redeploy_services | bool))

    - name: Attendre PostgreSQL sur data-01
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - observability-postgresql
          - pg_isready
          - -U
          - "{{ postgresql_user }}"
          - -d
          - "{{ postgresql_database }}"
      register: postgresql_ready
      retries: 15
      delay: 2
      until: postgresql_ready.rc == 0
      changed_when: false
      when: inventory_hostname == 'data-01'

    - name: Synchroniser le mot de passe du rôle PostgreSQL sur data-01
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -i
          - observability-postgresql
          - psql
          - -U
          - "{{ postgresql_user }}"
          - -d
          - postgres
        stdin: "ALTER ROLE {{ postgresql_user }} WITH LOGIN PASSWORD '{{ postgresql_password | replace(\"'\", \"''\") }}';"
      no_log: true
      changed_when: true
      when: inventory_hostname == 'data-01'

    - name: Attendre que le broker Kafka local accepte les requêtes d'administration
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - observability-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --list
      register: kafka_ready
      retries: 30
      delay: 2
      until: kafka_ready.rc == 0
      changed_when: false
      run_once: true
      delegate_to: data-01

    - name: Vérifier le endpoint de santé du Gateway OTLP
      ansible.builtin.uri:
        url: http://127.0.0.1:13133/
        status_code: 200
      register: otel_gateway_health
      retries: 15
      delay: 2
      until: otel_gateway_health.status == 200
      changed_when: false
      when: inventory_hostname == 'otel-01'

    - name: Vérifier le endpoint de santé de l'exporteur Kafka OTel
      ansible.builtin.uri:
        url: http://127.0.0.1:13134/
        status_code: 200
      register: otel_kafka_exporter_health
      retries: 15
      delay: 2
      until: otel_kafka_exporter_health.status == 200
      changed_when: false
      when: inventory_hostname == 'otel-01'

    - name: Vérifier le frontal HAProxy du Gateway OTLP
      ansible.builtin.command:
        argv:
          - haproxy
          - -c
          - -f
          - /etc/haproxy/haproxy.cfg
      changed_when: false
      when: inventory_hostname == 'otel-01'

    - name: Vérifier le socket d'administration HAProxy
      ansible.builtin.stat:
        path: /run/haproxy/admin.sock
      register: haproxy_admin_socket
      failed_when: not haproxy_admin_socket.stat.issock
      changed_when: false
      when: inventory_hostname == 'otel-01'

    - name: Attendre le quorum Kafka avant de créer les topics
      ansible.builtin.command:
        argv:
          # Une commande admin peut rester bloquée pendant une élection KRaft.
          # La borne laisse jouer les retries Ansible sans bloquer Vagrant.
          - timeout
          - 10s
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - observability-kafka
          - /opt/kafka/bin/kafka-metadata-quorum.sh
          - --bootstrap-server
          - localhost:9092
          - describe
          - --status
      register: kafka_quorum_ready
      retries: 60
      delay: 2
      until: >-
        kafka_quorum_ready.rc == 0 and
        (kafka_quorum_ready.stdout | regex_findall('"id"') | length) >= 1
      changed_when: false
      run_once: true
      delegate_to: data-01

    - name: Créer le topic de travail de la démonstration Kafka
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - observability-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --create
          - --if-not-exists
          - --topic
          - supermarket.order.placed
          - --partitions
          - '3'
          - --replication-factor
          - '1'
          - --config
          - min.insync.replicas=1
      register: kafka_demo_topic
      changed_when: "'Created topic' in kafka_demo_topic.stdout"
      run_once: true
      delegate_to: data-01

    - name: Créer le topic d'épuisement du stock
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - observability-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --create
          - --if-not-exists
          - --topic
          - supermarket.stock.depleted
          - --partitions
          - '3'
          - --replication-factor
          - '1'
          - --config
          - min.insync.replicas=1
      register: kafka_stock_depleted_topic
      changed_when: "'Created topic' in kafka_stock_depleted_topic.stdout"
      run_once: true
      delegate_to: data-01

    - name: Créer le topic de demande de réassort
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - observability-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --create
          - --if-not-exists
          - --topic
          - supermarket.stock.restock-requested
          - --partitions
          - '3'
          - --replication-factor
          - '1'
          - --config
          - min.insync.replicas=1
      register: kafka_stock_restock_requested_topic
      changed_when: "'Created topic' in kafka_stock_restock_requested_topic.stdout"
      run_once: true
      delegate_to: data-01

    - name: Lire le nombre de partitions du topic de démonstration
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - observability-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --describe
          - --topic
          - supermarket.order.placed
      register: kafka_demo_topic_description
      changed_when: false
      run_once: true
      delegate_to: data-01

    - name: Lire le nombre de partitions des topics de réassort
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - observability-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --describe
          - --topic
          - "{{ item }}"
      loop:
        - supermarket.stock.depleted
        - supermarket.stock.restock-requested
      register: kafka_restock_topics_description
      changed_when: false
      run_once: true
      delegate_to: data-01

    - name: Attendre MongoDB local
      # `retries` ne protège pas contre un mongosh bloqué : borner chaque
      # tentative permet à Ansible de continuer les contrôles et d'échouer
      # explicitement après le délai global plutôt que de rester suspendu.
      ansible.builtin.command: >-
        timeout 15 podman exec observability-mongodb mongosh --quiet
        'mongodb://127.0.0.1:27017/?directConnection=true'
        --eval 'db.adminCommand({ping: 1}).ok'
      register: mongodb_ping
      retries: 30
      delay: 2
      until: mongodb_ping.stdout | trim == '1'
      changed_when: false
      when: inventory_hostname == 'data-01'

    - name: Créer le répertoire de téléchargement de l'Elastic Agent
      ansible.builtin.file:
        path: /var/cache/observability
        state: directory
        owner: root
        mode: '0750'

    - name: Arrêter les anciens collecteurs
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: [observability-otel-agent, observability-otel-collector, filebeat, metricbeat]
      failed_when: false

    - name: Retirer les fichiers de configuration EDOT de la v2
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/observability/otel-agent.yml
        - /etc/systemd/system/observability-otel-agent.service
        - /var/lib/observability-otel-agent

    - name: Recharger systemd après le retrait de l'unité EDOT
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Déterminer l'architecture Elastic Agent
      ansible.builtin.set_fact:
        elastic_agent_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x86_64' }}"

    - name: Télécharger Elastic Agent s'il est absent
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
        dest: "/var/cache/observability/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
        mode: '0644'
      register: elastic_agent_archive
      when: fleet_enrollment_token | length > 0

    - name: Vérifier si Elastic Agent est déjà enrôlé
      ansible.builtin.stat:
        path: /opt/Elastic/Agent/elastic-agent
      register: enrolled_agent

    - name: Extraire Elastic Agent
      ansible.builtin.unarchive:
        src: "/var/cache/observability/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
        dest: /var/tmp
        remote_src: true
      when:
        - fleet_enrollment_token | length > 0
        - (elastic_agent_archive.changed | default(false)) or not enrolled_agent.stat.exists

    - name: Nettoyer une installation Fleet partielle
      ansible.builtin.file:
        path: /opt/Elastic/Agent
        state: absent
      when:
        - fleet_enrollment_token | length > 0
        - not enrolled_agent.stat.exists

    - name: Installer le package complet Elastic Agent
      ansible.builtin.copy:
        src: "/var/tmp/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}/"
        dest: /opt/observability/elastic-agent-package/
        mode: '0755'
        remote_src: true
      when:
        - fleet_enrollment_token | length > 0
        - not enrolled_agent.stat.exists

    - name: Ajouter le lanceur attendu à la racine du package Elastic Agent
      ansible.builtin.copy:
        src: /opt/observability/elastic-agent-package/data/elastic-agent-1bfb56/elastic-agent
        dest: /opt/observability/elastic-agent-package/elastic-agent
        mode: '0755'
        remote_src: true
      when:
        - fleet_enrollment_token | length > 0
        - not enrolled_agent.stat.exists

    - name: Ajouter la version attendue à la racine du package Elastic Agent
      ansible.builtin.copy:
        src: /opt/observability/elastic-agent-package/data/elastic-agent-1bfb56/package.version
        dest: /opt/observability/elastic-agent-package/package.version
        mode: '0644'
        remote_src: true
      when:
        - fleet_enrollment_token | length > 0
        - not enrolled_agent.stat.exists

    - name: Enrôler Elastic Agent dans Fleet
      ansible.builtin.shell: >-
        /opt/observability/elastic-agent-package/elastic-agent
        install --non-interactive --force --url={{ fleet_url }}
        --enrollment-token="$FLEET_ENROLLMENT_TOKEN" --insecure
      args:
        executable: /bin/bash
      when:
        - fleet_enrollment_token | length > 0
        - not enrolled_agent.stat.exists
      register: fleet_enrollment
      environment:
        FLEET_ENROLLMENT_TOKEN: "{{ fleet_enrollment_token }}"
