outputs:
  default:
    type: elasticsearch
    hosts:
      - https://elasticsearch.192-168-1-158.sslip.io:443
    # Elastic Agent attend la forme non encodée "<id>:<api_key>".
    api_key: "${ELASTICSEARCH_API_KEY}"
    preset: balanced
    ssl:
      # Réservé au laboratoire : Traefik présente un certificat auto-signé.
      verification_mode: none

agent:
  monitoring:
    enabled: true
    logs: true
    metrics: true
    use_output: default

# Une seule clé racine `inputs` doit exister dans le fichier.
inputs:
  - id: mongodb-logs
    name: mongodb
    type: logfile
    use_output: default
    data_stream:
      namespace: default
    streams:
      - id: mongodb-log
        data_stream:
          dataset: mongodb.log
          type: logs
        paths:
          - /var/log/mongodb/mongod.log
        tags:
          - mongodb-logs
        exclude_files:
          - '\.gz$'

  - id: mongodb-metrics
    name: mongodb
    type: mongodb/metrics
    use_output: default
    data_stream:
      namespace: default
    streams:
      - id: mongodb-collstats
        data_stream:
          dataset: mongodb.collstats
          type: metrics
        metricsets: [collstats]
        hosts: [localhost:27017]
        period: 60s

      - id: mongodb-dbstats
        data_stream:
          dataset: mongodb.dbstats
          type: metrics
        metricsets: [dbstats]
        hosts: [localhost:27017]
        period: 60s

      - id: mongodb-metrics
        data_stream:
          dataset: mongodb.metrics
          type: metrics
        metricsets: [metrics]
        hosts: [localhost:27017]
        period: 60s

      - id: mongodb-replstatus
        data_stream:
          dataset: mongodb.replstatus
          type: metrics
        metricsets: [replstatus]
        hosts: [localhost:27017]
        period: 60s

      - id: mongodb-status
        data_stream:
          dataset: mongodb.status
          type: metrics
        metricsets: [status]
        hosts: [localhost:27017]
        period: 60s
