# Registre Elastic auto-hébergé et figé sur la version du Stack. Cette image
# contient les packages publiés pour 8.11.3, dont APM 8.11.3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: package-registry
  namespace: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: package-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: package-registry
    spec:
      containers:
        - name: package-registry
          image: docker.elastic.co/package-registry/distribution:8.11.3
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: package-registry
  namespace: elastic-stack
spec:
  selector:
    app.kubernetes.io/name: package-registry
  ports:
    - name: http
      port: 8080
      targetPort: http
