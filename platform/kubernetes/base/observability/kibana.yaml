# Cette ressource est entièrement gérée par ce dépôt. Garder les références
# Kibana cohérentes dans fleet-server.yaml et apm-server.yaml si son nom change.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: es-kb-quickstart-eck-kibana
  namespace: elastic-stack
spec:
  version: 9.5.1
  count: 1
  elasticsearchRef:
    name: elasticsearch
  podTemplate:
    spec:
      containers:
        - name: kibana
          env:
            # Kibana/Fleet charge de nombreux assets au démarrage. La limite
            # Node par défaut à l'intérieur d'un cgroup de 1 Gio est trop
            # basse et provoque un "JavaScript heap out of memory".
            - name: NODE_OPTIONS
              value: --max-old-space-size=1280
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 2Gi
  config:
    # URL utilisée par Kibana pour les redirections et les liens générés derrière
    # l'IngressRoute Traefik.
    server.publicBaseUrl: https://kibana.poc.test
    # Adresses publiées dans les politiques remises aux agents hors Kubernetes.
    xpack.fleet.agents.fleet_server.hosts:
      - https://fleet.poc.test:443
    xpack.fleet.outputs:
      # Fleet Server s'exécute dans le cluster : il doit utiliser le service
      # Elasticsearch interne, et non l'Ingress public qui n'est pas
      # nécessairement joignable depuis les pods.
      - id: fleet-server-output
        name: Elasticsearch interne pour Fleet Server
        type: elasticsearch
        hosts:
          - https://elasticsearch-es-http.elastic-stack.svc:9200
      - id: fleet-default-output
        name: Elasticsearch ECK
        type: elasticsearch
        is_default: true
        is_default_monitoring: true
        hosts:
          - https://elasticsearch.poc.test:443
    xpack.fleet.packages:
      - name: fleet_server
        version: 1.6.1
      - name: elastic_agent
        version: 2.9.4
      - name: system
        version: 2.22.4
      - name: mongodb
        version: 1.24.0
      - name: kafka
        version: 1.27.2
      - name: postgresql
        version: 1.32.1
      # Requis par APM Server 8+ pour initialiser les assets APM dans Kibana.
      - name: apm
        version: 8.4.2
    xpack.fleet.agentPolicies:
      - id: eck-fleet-server
        name: Fleet Server on ECK
        namespace: default
        is_managed: true
        data_output_id: fleet-server-output
        monitoring_output_id: fleet-server-output
        monitoring_enabled:
          - logs
          - metrics
        package_policies:
          - id: fleet-server
            name: fleet-server
            package:
              name: fleet_server
      # Cette policy est remise aux Elastic Agents installés sur les VM. Les
      # intégrations sont déclarées ici, au démarrage de Kibana, plutôt que
      # créées par un script hôte via l'API Fleet.
      - id: mongodb-hosts
        name: MongoDB, Kafka and PostgreSQL hosts
        namespace: default
        monitoring_enabled:
          - logs
          - metrics
        package_policies:
          - id: system-fleet
            name: system-fleet
            package:
              name: system
            inputs:
              system-system/metrics:
                enabled: true
                streams:
                  '[system.cpu]': { enabled: true, vars: { period: 30s, '[cpu.metrics]': [percentages] } }
                  '[system.memory]': { enabled: true, vars: { period: 30s } }
                  '[system.load]': { enabled: true, vars: { period: 30s } }
                  '[system.network]': { enabled: true, vars: { period: 30s } }
                  '[system.process.summary]': { enabled: true, vars: { period: 30s } }
                  '[system.uptime]': { enabled: true, vars: { period: 30s } }
                  '[system.filesystem]':
                    enabled: true
                    vars:
                      period: 1m
                      processors: |-
                        - drop_event.when.regexp:
                            system.filesystem.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
                  '[system.fsstat]':
                    enabled: true
                    vars:
                      period: 1m
                      processors: |-
                        - drop_event.when.regexp:
                            system.fsstat.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
              system-logfile:
                enabled: true
                streams:
                  '[system.syslog]':
                    enabled: true
                    vars:
                      paths: [/var/log/messages*]
                      exclude_files: ['\\.gz$']
                      preserve_original_event: false
                  '[system.auth]':
                    enabled: true
                    vars:
                      paths: [/var/log/secure*]
                      exclude_files: ['\\.gz$']
                      preserve_original_event: false
          - id: mongodb-fleet
            name: mongodb-fleet
            package:
              name: mongodb
            inputs:
              mongodb-logfile:
                enabled: false
              mongodb-mongodb/metrics:
                enabled: true
                vars:
                  hosts:
                    - localhost:27017
                  # Les clés de variables contenant un point doivent être
                  # protégées par des crochets : sinon Kibana les interprète
                  # comme une arborescence de configuration (`ssl.enabled`).
                  '[ssl.enabled]': false
                streams:
                  '[mongodb.collstats]':
                    enabled: true
                    vars:
                      period: 60s
                  '[mongodb.dbstats]':
                    enabled: true
                    vars:
                      period: 60s
                  '[mongodb.metrics]':
                    enabled: true
                    vars:
                      period: 60s
                  '[mongodb.replstatus]':
                    enabled: true
                    vars:
                      period: 60s
                  '[mongodb.status]':
                    enabled: true
                    vars:
                      period: 60s
          - id: kafka-fleet
            name: kafka-fleet
            package:
              name: kafka
            inputs:
              kafka-logfile:
                enabled: false
              kafka-kafka/metrics:
                enabled: true
                vars:
                  hosts:
                    - localhost:9092
                  period: 60s
                streams:
                  '[kafka.broker]':
                    enabled: true
                    vars:
                      jolokia_hosts:
                        - http://127.0.0.1:8778
                  '[kafka.partition]':
                    enabled: true
                  '[kafka.consumergroup]':
                    enabled: true
              kafka-jolokia/metrics:
                enabled: true
                vars:
                  hosts:
                    - http://127.0.0.1:8778
                  metrics_path: /jolokia
                  http_method: GET
                streams:
                  '[kafka.controller]': { enabled: true, vars: { period: 60s } }
                  '[kafka.jvm]': { enabled: true, vars: { period: 60s } }
                  '[kafka.network]': { enabled: true, vars: { period: 60s } }
                  '[kafka.log_manager]': { enabled: true, vars: { period: 60s } }
                  '[kafka.replica_manager]': { enabled: true, vars: { period: 60s } }
                  '[kafka.topic]': { enabled: true, vars: { period: 60s } }
                  '[kafka.raft]': { enabled: true, vars: { period: 60s } }
          # PostgreSQL n'est présent que sur data-01. La condition est évaluée
          # par Elastic Agent : les agents data-02 et data-03 ne démarrent pas
          # cet input, tout en restant rattachés à cette policy unique.
          - id: postgresql-fleet
            name: postgresql-fleet
            package:
              name: postgresql
            inputs:
              postgresql-logfile:
                enabled: false
              postgresql-postgresql/metrics:
                enabled: true
                vars:
                  hosts:
                    - postgres://localhost:5432/observability_test?sslmode=disable
                  username: observability
                  password: poc-postgresql-password
                  condition: '${host.name} == "data-01"'
                streams:
                  '[postgresql.activity]':
                    enabled: true
                    vars: { period: 60s }
                  '[postgresql.bgwriter]':
                    enabled: true
                    vars: { period: 60s }
                  '[postgresql.database]':
                    enabled: true
                    vars: { period: 60s }
                  '[postgresql.statement]':
                    enabled: false
                    vars: { period: 60s }
