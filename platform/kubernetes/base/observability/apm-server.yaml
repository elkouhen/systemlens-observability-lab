apiVersion: apm.k8s.elastic.co/v1
kind: ApmServer
metadata:
  name: apm-server
  namespace: elastic-stack
spec:
  version: 8.11.3
  count: 1
  # Ne pas définir elasticsearchRef : ECK ajouterait une sortie Elasticsearch
  # concurrente. La sortie unique est Logstash, déclarée ci-dessous.
  # Requis à partir d'APM Server 8 pour l'application APM et la configuration
  # centrale des agents Java Elastic APM.
  kibanaRef:
    # Secret créé par make apm-kibana-role-apply ; l'utilisateur viewer
    # remplace le compte file-realm ECK dépourvu des droits Fleet requis.
    secretName: apm-server-kibana-credentials
  config:
    # Les événements APM sont remis à Logstash par Lumberjack. Logstash est
    # responsable de leur écriture dans les data streams Elasticsearch.
    output.logstash:
      enabled: true
      hosts:
        - apm-logstash.elastic-stack.svc:5044
    http:
      enabled: true
      host: 127.0.0.1
      port: 5066
    monitoring:
      enabled: false
