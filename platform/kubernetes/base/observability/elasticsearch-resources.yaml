# Référence de configuration pour une future migration d'Elasticsearch vers
# GitOps. Ne pas ajouter ce fichier au kustomization tant que la release Helm
# `es-kb-quickstart` en est propriétaire.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elastic-stack
spec:
  version: 9.5.1
  nodeSets:
    - name: default
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 2Gi
