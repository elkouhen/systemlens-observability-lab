apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-logs-agent
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-logs-agent
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - events
      - namespaces
      - nodes
      - nodes/metrics
      - nodes/proxy
      - nodes/stats
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-logs-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-logs-agent
subjects:
  - kind: ServiceAccount
    name: kubernetes-logs-agent
    namespace: elastic-stack
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: kubernetes-logs
  namespace: elastic-stack
spec:
  version: 8.11.3
  mode: standalone
  serviceAccountName: kubernetes-logs-agent
  elasticsearchRefs:
    - name: elasticsearch
  daemonSet:
    podTemplate:
      spec:
        automountServiceAccountToken: true
        serviceAccountName: kubernetes-logs-agent
        containers:
          - name: agent
            securityContext:
              runAsUser: 0
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
  config:
    inputs:
      # Les métriques kubelet sont locales à chaque nœud : cet Agent en
      # DaemonSet couvre donc l'ensemble des pods et conteneurs du cluster.
      - id: kubernetes-node-metrics
        type: kubernetes/metrics
        use_output: default
        meta:
          package:
            name: kubernetes
            version: 1.27.1
        data_stream:
          namespace: default
        streams:
          - id: kubernetes-node-metrics-container
            data_stream:
              type: metrics
              dataset: kubernetes.container
            metricsets: [container]
            add_metadata: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            hosts: ["https://${env.NODE_NAME}:10250"]
            period: 10s
            ssl.verification_mode: none
          - id: kubernetes-node-metrics-node
            data_stream:
              type: metrics
              dataset: kubernetes.node
            metricsets: [node]
            add_metadata: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            hosts: ["https://${env.NODE_NAME}:10250"]
            period: 10s
            ssl.verification_mode: none
          - id: kubernetes-node-metrics-pod
            data_stream:
              type: metrics
              dataset: kubernetes.pod
            metricsets: [pod]
            add_metadata: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            hosts: ["https://${env.NODE_NAME}:10250"]
            period: 10s
            ssl.verification_mode: none
          - id: kubernetes-node-metrics-system
            data_stream:
              type: metrics
              dataset: kubernetes.system
            metricsets: [system]
            add_metadata: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            hosts: ["https://${env.NODE_NAME}:10250"]
            period: 10s
            ssl.verification_mode: none
          - id: kubernetes-node-metrics-volume
            data_stream:
              type: metrics
              dataset: kubernetes.volume
            metricsets: [volume]
            add_metadata: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            hosts: ["https://${env.NODE_NAME}:10250"]
            period: 10s
            ssl.verification_mode: none
      - id: supermarket-demo-container-logs
        type: filestream
        streams:
          - id: supermarket-demo-container-logs-stream
            data_stream:
              dataset: kubernetes.container_logs
            paths:
              - /var/log/containers/*_supermarket-demo_*.log
            prospector.scanner.symlinks: true
            parsers:
              - container:
                  stream: all
                  format: auto
            processors:
              - decode_json_fields:
                  fields: ["message"]
                  target: ""
                  overwrite_keys: true
                  expand_keys: true
              - rename:
                  fields:
                    - from: trace_id
                      to: trace.id
                    - from: span_id
                      to: span.id
                    - from: trace_flags
                      to: labels.otel_trace_flags
                  ignore_missing: true
                  fail_on_error: false
