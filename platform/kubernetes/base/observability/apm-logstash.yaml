apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-logstash-pipeline
  namespace: elastic-stack
data:
  elastic-apm-and-agent.conf: |
    input {
      # Flux APM Server (protocole Lumberjack).
      elastic_agent {
        port => 5044
        enrich => none
      }

      # Flux des Elastic Agents Kubernetes (protocole Beats/Logstash).
      beats {
        port => 5045
      }
    }

    output {
      # Les événements sont déjà ECS et portent leur data_stream. Ne pas les
      # transformer dans Logstash afin de préserver les champs APM et ECS.
      elasticsearch {
        hosts => ["https://elasticsearch-es-http.elastic-stack.svc:9200"]
        api_key => "${ELASTICSEARCH_API_KEY}"
        data_stream => true
        ssl_certificate_authorities => "/usr/share/logstash/config/elasticsearch-ca/ca.crt"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-logstash-settings
  namespace: elastic-stack
data:
  logstash.yml: |
    api.http.host: 0.0.0.0
    pipeline.ecs_compatibility: v8
    config.reload.automatic: true
    config.reload.interval: 3s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-logstash
  namespace: elastic-stack
  labels:
    app.kubernetes.io/name: apm-logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.3
          ports:
            - name: apm-lumberjack
              containerPort: 5044
            - name: agent-beats
              containerPort: 5045
          env:
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apm-logstash-elasticsearch
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
            - name: settings
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: elasticsearch-ca
              mountPath: /usr/share/logstash/config/elasticsearch-ca
              readOnly: true
      volumes:
        - name: pipeline
          configMap:
            name: apm-logstash-pipeline
        - name: settings
          configMap:
            name: apm-logstash-settings
        - name: elasticsearch-ca
          secret:
            secretName: elasticsearch-es-http-certs-public
---
apiVersion: v1
kind: Service
metadata:
  name: apm-logstash
  namespace: elastic-stack
  labels:
    app.kubernetes.io/name: apm-logstash
spec:
  selector:
    app.kubernetes.io/name: apm-logstash
  ports:
    - name: apm-lumberjack
      port: 5044
      targetPort: apm-lumberjack
    - name: agent-beats
      port: 5045
      targetPort: agent-beats
