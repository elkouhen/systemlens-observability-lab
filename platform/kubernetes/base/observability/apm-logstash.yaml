apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-logstash-pipeline
  namespace: elastic-stack
data:
  elastic-apm-and-agent.conf: |
    input {
      # Flux APM Server (protocole Lumberjack).
      elastic_agent {
        port => 5044
        enrich => none
      }

      # Flux des Elastic Agents Kubernetes (protocole Beats/Logstash).
      beats {
        port => 5045
      }
    }

    filter {
      # Les logs Kubernetes tirent leur identité du namespace, par exemple
      # h0tl-supermarche-app. Les signaux APM conservent ELASTIC_APM_ENVIRONMENT.
      # Les deux sources respectent <type><ptf_sur_3_caracteres>-<namespace>.
      if [data_stream][type] == "logs" and [data_stream][dataset] == "kubernetes.container_logs" and [kubernetes][namespace] =~ /^[rphid][A-Za-z0-9]{3}-.+$/ {
        mutate {
          copy => {
            "[kubernetes][namespace]" => "[@metadata][routing_identity]"
          }
        }
      } else if [service][environment] =~ /^[rphid][A-Za-z0-9]{3}-.+$/ {
        mutate {
          copy => {
            "[service][environment]" => "[@metadata][routing_identity]"
          }
        }
      }

      if [@metadata][routing_identity] {
        grok {
          match => {
            "[@metadata][routing_identity]" => "^(?<environment_type>[rphid])(?<platform_code>[A-Za-z0-9]{3})-(?<application_namespace>.+)$"
          }
        }

        # Le dictionnaire centralise la correspondance entre le code du contrat
        # applicatif et le nom d'environnement Elastic attendu.
        translate {
          source => "environment_type"
          target => "[@metadata][environment]"
          dictionary => {
            "r" => "recette"
            "p" => "production"
            "h" => "homologation"
            "i" => "integration"
            "d" => "developpement"
          }
          fallback => ""
        }

        if [@metadata][environment] {
          mutate {
            add_field => {
              "[labels][ptf]" => "%{platform_code}"
              "[labels][namespace]" => "%{application_namespace}"
            }
            replace => {
              "[service][environment]" => "%{[@metadata][environment]}"
            }
          }

          # Les logs Kubernetes sont séparés par plateforme et environnement,
          # sans dépendre d'une variable de log applicative.
          # Seules les métriques APM Java de conteneurs sont reroutées vers
          # le data stream applicatif par environnement.
          if [data_stream][type] == "logs" and [data_stream][dataset] == "kubernetes.container_logs" {
            mutate {
              replace => {
                "[data_stream][dataset]" => "kube-%{platform_code}"
                "[data_stream][namespace]" => "%{[@metadata][environment]}"
              }
            }
          } else if [data_stream][type] == "metrics" and [agent][name] == "java" and [container][id] {
            mutate {
              replace => {
                "[data_stream][dataset]" => "apm.app.kubernetes"
                "[data_stream][namespace]" => "%{[@metadata][environment]}"
              }
            }
          }

          mutate {
            remove_field => ["environment_type", "platform_code", "application_namespace"]
          }
        }
      }
    }

    output {
      # Les événements restent ECS. Les règles ci-dessus ne modifient que le
      # data stream des logs et métriques applicatives concernés.
      elasticsearch {
        hosts => ["https://elasticsearch-es-http.elastic-stack.svc:9200"]
        api_key => "${ELASTICSEARCH_API_KEY}"
        data_stream => true
        ssl_certificate_authorities => "/usr/share/logstash/config/elasticsearch-ca/ca.crt"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-logstash-settings
  namespace: elastic-stack
data:
  logstash.yml: |
    api.http.host: 0.0.0.0
    pipeline.ecs_compatibility: v8
    config.reload.automatic: true
    config.reload.interval: 3s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-logstash
  namespace: elastic-stack
  labels:
    app.kubernetes.io/name: apm-logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.3
          ports:
            - name: apm-lumberjack
              containerPort: 5044
            - name: agent-beats
              containerPort: 5045
          env:
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apm-logstash-elasticsearch
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
            - name: settings
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: elasticsearch-ca
              mountPath: /usr/share/logstash/config/elasticsearch-ca
              readOnly: true
      volumes:
        - name: pipeline
          configMap:
            name: apm-logstash-pipeline
        - name: settings
          configMap:
            name: apm-logstash-settings
        - name: elasticsearch-ca
          secret:
            secretName: elasticsearch-es-http-certs-public
---
apiVersion: v1
kind: Service
metadata:
  name: apm-logstash
  namespace: elastic-stack
  labels:
    app.kubernetes.io/name: apm-logstash
spec:
  selector:
    app.kubernetes.io/name: apm-logstash
  ports:
    - name: apm-lumberjack
      port: 5044
      targetPort: apm-lumberjack
    - name: agent-beats
      port: 5045
      targetPort: agent-beats
