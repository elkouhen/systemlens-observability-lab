---
- name: Appliquer uniquement la rétention des VM
  hosts: all
  become: true
  gather_facts: false
  roles:
    - retention

- name: Réconcilier la rétention Kafka
  hosts: poc_nodes
  become: true
  gather_facts: false
  vars:
    node_id: 1
    node_ip: 192.168.33.10
    kafka_cluster_id: q1Sh-9_ISia_zwGINzRvyQ
    kafka_controller_voters: 1@192.168.33.10:9093
  tasks:
    - name: Déployer la configuration déclarative du broker
      ansible.builtin.template:
        src: roles/poc/templates/kafka.container.j2
        dest: /etc/containers/systemd/observability-kafka.container
        mode: '0644'
      register: retention_kafka

    - name: Redémarrer Kafka si sa configuration a changé
      ansible.builtin.systemd_service:
        name: observability-kafka
        daemon_reload: true
        state: restarted
      when: retention_kafka.changed

    - name: Attendre la disponibilité Kafka
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-kafka
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      register: retention_topics
      until: retention_topics.rc == 0
      retries: 20
      delay: 3
      changed_when: false

    - name: Lire les paramètres effectifs de chaque topic applicatif et OTLP
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-kafka
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092
        --entity-type topics --entity-name {{ item }} --describe --all
      loop: "{{ retention_topics.stdout_lines | select('match', '^(supermarket[.]|otel-)') | list }}"
      register: retention_topic_configs
      changed_when: false

    - name: Réconcilier les overrides de rétention des topics existants
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-kafka
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092
        --entity-type topics --entity-name {{ item.item }} --alter
        --add-config retention.ms=86400000,retention.bytes=536870912,segment.ms=3600000,segment.bytes=67108864,cleanup.policy=delete
      loop: "{{ retention_topic_configs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: >-
        'retention.ms=86400000 ' not in item.stdout or
        'retention.bytes=536870912 ' not in item.stdout or
        'segment.ms=3600000 ' not in item.stdout or
        'segment.bytes=67108864 ' not in item.stdout or
        'cleanup.policy=delete ' not in item.stdout
      changed_when: true
