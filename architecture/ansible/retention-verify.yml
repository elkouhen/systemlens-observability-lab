---
- name: Vérifier la rétention des journaux sur les VM
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Vérifier les timers et journald
      ansible.builtin.command: systemctl is-active systemd-journald logrotate.timer observability-purge-logs.timer
      changed_when: false

    - name: Vérifier la syntaxe globale de logrotate
      ansible.builtin.command: logrotate --debug /etc/logrotate.conf
      changed_when: false

    - name: Lire le plafond journald déployé
      ansible.builtin.slurp:
        src: /etc/systemd/journald.conf.d/observability-retention.conf
      register: retention_journal

    - name: Vérifier les limites journald déclarées
      ansible.builtin.assert:
        that:
          - "'MaxRetentionSec=1day' in (retention_journal.content | b64decode)"
          - "'SystemMaxUse=256M' in (retention_journal.content | b64decode)"

    - name: Vérifier la dernière exécution du nettoyage
      ansible.builtin.command: systemctl show observability-purge-logs.service -p Result -p ExecMainStatus -p ExecMainStartTimestamp
      register: retention_cleanup_status
      changed_when: false
      failed_when: >-
        'Result=success' not in retention_cleanup_status.stdout or
        'ExecMainStatus=0' not in retention_cleanup_status.stdout or
        retention_cleanup_status.stdout is search('ExecMainStartTimestamp=($|\n)')

    - name: Lire l'occupation disque des journaux
      ansible.builtin.command: journalctl --disk-usage
      register: retention_usage
      changed_when: false

    - name: Afficher l'occupation des journaux
      ansible.builtin.debug:
        var: retention_usage.stdout

- name: Vérifier les paramètres effectifs du broker métier et des topics
  hosts: poc_nodes
  become: true
  gather_facts: false
  tasks:
    - name: Lire la configuration effective du broker
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-kafka
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092
        --entity-type brokers --entity-name 1 --describe --all
      register: retention_broker
      changed_when: false

    - name: Vérifier la rétention effective du broker
      ansible.builtin.assert:
        that:
          - "'log.retention.hours=24 ' in retention_broker.stdout"
          - "'log.retention.bytes=536870912 ' in retention_broker.stdout"
          - "'log.cleanup.policy=delete ' in retention_broker.stdout"
          - "'log.roll.hours=1 ' in retention_broker.stdout"

    - name: Lire les topics
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-kafka
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      register: retention_topics
      changed_when: false

    - name: Lire les rétentions effectives des topics
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-kafka
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092
        --entity-type topics --entity-name {{ item }} --describe --all
      loop: "{{ retention_topics.stdout_lines | select('match', '^(supermarket[.]|otel-)') | list }}"
      register: retention_configs
      changed_when: false

    - name: Vérifier la rétention des topics métier et OTLP
      ansible.builtin.assert:
        that:
          - "'retention.ms=86400000 ' in item.stdout"
          - "'retention.bytes=536870912 ' in item.stdout"
          - "'segment.ms=3600000 ' in item.stdout"
          - "'cleanup.policy=delete ' in item.stdout"
      loop: "{{ retention_configs.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Vérifier les paramètres effectifs du broker Kafka OTel et des topics
  hosts: otel_backend_nodes
  become: true
  gather_facts: false
  tasks:
    - name: Lire la configuration effective du broker Kafka OTel
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-otel-kafka
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092
        --entity-type brokers --entity-name 2 --describe --all
      register: retention_otel_broker
      changed_when: false

    - name: Vérifier la rétention effective du broker Kafka OTel
      ansible.builtin.assert:
        that:
          - "'log.retention.hours=24 ' in retention_otel_broker.stdout"
          - "'log.retention.bytes=536870912 ' in retention_otel_broker.stdout"
          - "'log.cleanup.policy=delete ' in retention_otel_broker.stdout"
          - "'log.roll.hours=1 ' in retention_otel_broker.stdout"

    - name: Lire les topics Kafka OTel
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-otel-kafka
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      register: retention_otel_topics
      changed_when: false

    - name: Lire les rétentions effectives des topics Kafka OTel
      ansible.builtin.command: >-
        podman exec --env KAFKA_OPTS= observability-otel-kafka
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092
        --entity-type topics --entity-name {{ item }} --describe --all
      loop: "{{ retention_otel_topics.stdout_lines | select('match', '^otel-') | list }}"
      register: retention_otel_configs
      changed_when: false

    - name: Vérifier la rétention des topics Kafka OTel
      ansible.builtin.assert:
        that:
          - "'retention.ms=86400000 ' in item.stdout"
          - "'retention.bytes=536870912 ' in item.stdout"
          - "'segment.ms=3600000 ' in item.stdout"
          - "'cleanup.policy=delete ' in item.stdout"
      loop: "{{ retention_otel_configs.results }}"
      loop_control:
        label: "{{ item.item }}"
