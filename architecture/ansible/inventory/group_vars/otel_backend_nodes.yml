---
# Rattachement des VM du groupe (ADR-015) : plateforme, environnement et
# Edge cible. otel_edge désigne un hôte de otel_edge_nodes, ou kafka-local
# pour l'agent qui publie directement dans le Kafka OTel local (ADR-005).
otel_platform: elk
otel_environment: homologation
otel_edge: kafka-local
firewall_tcp_ports: [9092, 9093, 8778, 9999, 4319, 4320]
firewall_udp_ports: []
middleware_credentials_required: false
# Registre des plateformes du backend mutualisé (ADR-015, ADR-017). Chaque
# entrée reçoit trois topics otel-{logs,metrics,traces}-<platform>-<environment>,
# créés par le rôle otel_backend, et seuls ses publishers (hôtes Edge, ou
# hôte dont l'agent EDOT publie en kafka-local) peuvent y écrire (ACL Kafka).
# Le backend ne lit pas la configuration des Edge ; make otel-config-validate
# vérifie que leurs tables restent dans ce registre.
otel_platforms:
  - platform: k3s
    environment: homologation
    publishers: [otel-edge-01]
  - platform: supermarche
    environment: homologation
    publishers: [otel-edge-01]
  - platform: elk
    environment: homologation
    publishers: [otel-edge-01, otel-backend-01]
  - platform: demo
    environment: homologation
    publishers: [otel-edge-01]
# Rétention des topics OTel : un jour et 512 Mio par partition.
otel_kafka_topic_retention_ms: 86400000
otel_kafka_topic_retention_bytes: 536870912
