---
otel_edge_client_key_env: OTEL_EDGE_KEY_EDGE_AGENT
firewall_tcp_ports: [4317, 4318]
firewall_udp_ports: []
middleware_credentials_required: false
# Routage des signaux vers les topics Kafka suffixés otel-<signal>-<suffixe>
# (ADR-009, ADR-010). Un signal dont la ressource porte k8s.namespace.name égal
# à kubernetes_namespace est publié dans otel-<signal>-<kafka_topic_suffix> ;
# ses logs et métriques reçoivent data_stream.dataset = data_stream_dataset
# ([a-z0-9_]). Les traces gardent le dataset apm d'APM Server. Le backend
# dérive data_stream.namespace de deployment.environment(.name).
otel_edge_application_routes:
  - kubernetes_namespace: h0tl-supermarche-app
    kafka_topic_suffix: supermarche
    data_stream_dataset: supermarche
# Suffixe de topic des signaux marqués otel.edge.source=kubernetes par les
# collecteurs Kubernetes (otel-kubernetes, otel-kubernetes-cluster). Leur
# dataset reste celui du receiver, lu par les dashboards [Kubernetes OTel].
otel_edge_kubernetes_kafka_topic_suffix: k8s
