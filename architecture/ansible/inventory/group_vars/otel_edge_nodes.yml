---
# Rattachement des VM du groupe (ADR-015) : plateforme, environnement et
# Edge cible. otel_edge désigne un hôte de otel_edge_nodes, ou kafka-local
# pour l'agent qui publie directement dans le Kafka OTel local (ADR-005).
otel_platform: elk
otel_environment: homologation
otel_edge: otel-edge-01
firewall_tcp_ports: [4317, 4318]
firewall_udp_ports: []
middleware_credentials_required: false
# Cluster Kubernetes servi par cet Edge (ADR-015). Toute ressource Kubernetes
# reçoit k8s.cluster.name = name. Les signaux des collecteurs Kubernetes
# (marqueur otel.edge.source=kubernetes) et ceux de leur namespace vont dans
# la plateforme du cluster, avec le dataset de leur receiver, lu par les
# dashboards [Kubernetes OTel] et [OTel] Host.
otel_edge_cluster:
  name: k3s-01
  kubernetes_namespace: elastic-stack
  platform: k3s
  environment: homologation
# Plateformes hébergées par le cluster : un namespace Kubernetes est une
# plateforme dans un environnement. Les signaux du namespace vont dans
# otel-<signal>-<platform>-<environment> ; dataset ([a-z0-9_.]) est posé sur
# les logs et les métriques, ou receiver pour garder celui du receiver. Les
# traces gardent les datasets apm d'APM Server. L'Edge pose aussi
# deployment.environment.name, en écrasant la valeur envoyée.
# Les VM rattachées à cet Edge sont lues dans l'inventaire (otel_edge).
otel_edge_namespace_routes:
  - kubernetes_namespace: h0tl-supermarche-app
    platform: supermarche
    environment: homologation
    dataset: supermarche
  - kubernetes_namespace: h0tl-demo-app
    platform: demo
    environment: homologation
    dataset: demo
