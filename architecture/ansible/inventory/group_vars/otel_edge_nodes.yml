---
otel_edge_client_key_env: OTEL_EDGE_KEY_EDGE_AGENT
firewall_tcp_ports: [4317, 4318]
firewall_udp_ports: []
middleware_credentials_required: false
# Routage des signaux vers les topics Kafka suffixés otel-<signal>-<namespace>
# (ADR-009). Le backend dérive data_stream.namespace du suffixe (ADR-007).
# Un signal dont la ressource porte k8s.namespace.name égal à
# kubernetes_namespace est publié dans otel-<signal>-<data_stream_namespace>.
otel_edge_application_routes:
  - kubernetes_namespace: h0tl-supermarche-app
    data_stream_namespace: supermarche
# Namespace des signaux marqués otel.edge.source=kubernetes par les collecteurs
# Kubernetes (otel-kubernetes, otel-kubernetes-cluster).
otel_edge_kubernetes_data_stream_namespace: k8s
