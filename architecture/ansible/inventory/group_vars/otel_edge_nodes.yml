---
otel_edge_client_key_env: OTEL_EDGE_KEY_EDGE_AGENT
firewall_tcp_ports: [4317, 4318]
firewall_udp_ports: []
middleware_credentials_required: false
# Table de routage du collecteur Edge (ADR-009 ; ADR-007, note du
# 2026-11-02). Une ressource dont k8s.namespace.name vaut kubernetes_namespace
# est publiée dans otel-<signal>-<kafka_topic>. Le topic porte toute la cible :
# kafka_topic = <dataset>-<namespace> ([a-z0-9_] de part et d'autre). Le
# collecteur backend en tire data_stream.dataset et data_stream.namespace pour
# les logs et métriques, et le namespace <dataset>_<namespace> pour les
# traces, qui gardent les datasets apm d'APM Server. Les trois topics
# otel-{logs,metrics,traces}-<kafka_topic> sont créés par le job
# otel-telemetry-topics.
# L'Edge est aussi la référence de la plateforme et de l'environnement d'une
# application déployée : il pose k8s.cluster.name = platform et
# deployment.environment.name = environment sur chaque ressource de la route,
# en écrasant la valeur éventuellement envoyée par l'application.
# environment est le <namespace> du topic.
otel_edge_application_routes:
  - kubernetes_namespace: h0tl-supermarche-app
    kafka_topic: supermarche-homologation
    platform: k3s-01
    environment: homologation
# Route des signaux marqués otel.edge.source=kubernetes par les collecteurs
# Kubernetes (otel-kubernetes, otel-kubernetes-cluster). kafka_topic =
# <namespace> seul : le dataset reste celui du receiver, lu par les
# dashboards [Kubernetes OTel] (ADR-010).
otel_edge_kubernetes_route:
  kafka_topic: homologation
