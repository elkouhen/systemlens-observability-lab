---
- name: Vérifier les variables injectées par Vagrant
  ansible.builtin.assert:
    that: [node_ip is defined]
    fail_msg: Vagrant doit fournir node_ip.

- name: Vérifier les secrets nécessaires au lab
  ansible.builtin.assert:
    that:
      - postgresql_password | length > 0
      - mongodb_otel_password | length > 0
    fail_msg: Définir POSTGRESQL_PASSWORD et MONGODB_PASSWORD hors Git.
  when: middleware_credentials_required | default(false)

- name: Identifier l'interface du réseau privé
  ansible.builtin.shell: |
    ip -o -4 addr show | awk -v ip='{{ node_ip }}' '$4 ~ ("^" ip "/") { print $2; exit }'
  args:
    executable: /bin/bash
  register: private_network_device
  changed_when: false

- name: Vérifier les interfaces réseau Ubuntu
  ansible.builtin.assert:
    that:
      - private_network_device.stdout | trim | length > 0
      - ansible_default_ipv4.interface | length > 0
      - private_network_device.stdout | trim != ansible_default_ipv4.interface
    fail_msg: >-
      Les interfaces privée et NAT Ubuntu n'ont pas pu être identifiées
      séparément.

- name: Empêcher le réseau privé de devenir la route par défaut sous Ubuntu
  ansible.builtin.copy:
    dest: /etc/netplan/99-observability-network.yaml
    mode: '0600'
    content: |
      network:
        version: 2
        ethernets:
          {{ private_network_device.stdout | trim }}:
            dhcp4-overrides:
              use-routes: false
              use-dns: false
            dhcp6-overrides:
              use-routes: false
              use-dns: false
          {{ ansible_default_ipv4.interface }}:
            dhcp4-overrides:
              use-routes: true
              use-dns: false
            nameservers:
              addresses: [{{ vm_dns_servers }}]
  register: ubuntu_network_configuration

- name: Appliquer la configuration réseau Ubuntu
  ansible.builtin.command: netplan apply
  when: ubuntu_network_configuration.changed
  changed_when: true

- name: Vérifier la résolution DNS avant les installations réseau
  ansible.builtin.command: getent ahostsv4 raw.githubusercontent.com
  register: github_dns
  changed_when: false
  retries: 5
  delay: 3
  until: github_dns.rc == 0

- name: Installer le certificat racine d'entreprise si fourni
  ansible.builtin.copy:
    content: "{{ zscaler_ca_cert_content }}"
    dest: "{{ '/usr/local/share/ca-certificates/zscaler-root-ca.crt' if ansible_os_family == 'Debian' else '/etc/pki/ca-trust/source/anchors/zscaler-root-ca.crt' }}"
    mode: '0644'
  register: zscaler_ca
  when: zscaler_ca_cert_content | length > 0

- name: Actualiser le magasin de certificats
  ansible.builtin.command: "{{ 'update-ca-certificates' if ansible_os_family == 'Debian' else 'update-ca-trust extract' }}"
  when: zscaler_ca.changed | default(false)
  changed_when: true

- name: Actualiser les index APT avant l'installation des dépendances
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Installer les dépendances système
  ansible.builtin.package:
    name: [podman, curl, openssl, chrony, haproxy, firewalld, ca-certificates]
    state: present

- name: Vérifier la présence du générateur Quadlet rootful
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/lib/systemd/system-generators/podman-system-generator
    - /lib/systemd/system-generators/podman-system-generator
  register: podman_quadlet_generator_paths

- name: Définir le chemin du générateur Quadlet rootful
  ansible.builtin.set_fact:
    podman_system_generator_path: >-
      {{ (podman_quadlet_generator_paths.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default('') }}

- name: Refuser une installation Podman sans générateur Quadlet
  ansible.builtin.assert:
    that: podman_system_generator_path | length > 0
    fail_msg: >-
      Le générateur Quadlet rootful est absent. Réinstaller le paquet Ubuntu
      podman avant de déployer les unités .container.

- name: Collecter l'état des services système
  ansible.builtin.service_facts:

- name: Configurer des sources NTP accessibles en IPv4
  ansible.builtin.replace:
    path: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    regexp: '^(pool .*\.pool\.ntp\.org|server time\.cloudflare\.com|server time\.google\.com) iburst$'
    replace: |-
      server 162.159.200.1 iburst
      server 162.159.200.123 iburst
      server 216.239.35.12 iburst
  register: chrony_configuration

- name: Autoriser chrony à corriger automatiquement un décalage après un redémarrage
  ansible.builtin.lineinfile:
    path: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    regexp: '^makestep '
    line: makestep 1.0 3
    insertafter: EOF
  register: chrony_makestep_configuration

- name: Synchroniser l'horloge matérielle avec l'horloge système
  ansible.builtin.lineinfile:
    path: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    regexp: '^rtcsync$'
    line: rtcsync
    insertafter: '^makestep '
  register: chrony_rtcsync_configuration

- name: Redémarrer chrony après modification de sa configuration
  ansible.builtin.systemd_service:
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    state: restarted
  when: >-
    chrony_configuration.changed or
    chrony_makestep_configuration.changed or
    chrony_rtcsync_configuration.changed

- name: Activer la synchronisation NTP
  ansible.builtin.systemd_service:
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    enabled: true
    state: started

- name: Corriger immédiatement l'horloge si une source NTP est disponible
  ansible.builtin.command: chronyc makestep
  changed_when: false
  failed_when: false

- name: Autoriser les ports de la topologie sur firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_tcp_ports | default([]) }}"
  when: ansible_facts.services['firewalld.service'].state | default('stopped') == 'running'

- name: Autoriser les ports UDP de la topologie sur firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/udp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_udp_ports | default([]) }}"
  when: ansible_facts.services['firewalld.service'].state | default('stopped') == 'running'

- name: Créer les répertoires de la plateforme
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    mode: '0755'
  loop:
    - /etc/observability
    - /etc/containers/systemd
    - /usr/share/containers/systemd
    - /var/lib/observability
    - /var/lib/observability/otel-backend
    - /var/cache/observability
    - /opt/observability

- name: Installer la résolution locale des VM
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: '# {mark} lab OBSERVABILITY HOSTS'
    block: |
      {{ supermarket_middleware_ip }} supermarket-middleware-01
      {{ otel_backend_ip }} otel-backend-01
      {{ otel_edge_ip }} otel-edge-01
      {{ elk_ip }} elk-01
      {{ k3s_ip }} k3s-01
      {{ elk_ip }} kibana.observability.test elasticsearch.observability.test fleet.observability.test apm.observability.test
