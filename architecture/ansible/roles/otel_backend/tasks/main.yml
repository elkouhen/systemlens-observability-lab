---
- name: Autoriser le conteneur exporteur OTEL à écrire son file_storage
  ansible.builtin.file:
    path: /var/lib/observability/otel-kafka-exporter
    state: directory
    mode: '0777'

- name: Créer les répertoires du broker Kafka OTel
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/log/kafka, mode: '0777'}

- name: Télécharger l'agent Jolokia du broker Kafka OTel
  ansible.builtin.get_url:
    url: https://repo1.maven.org/maven2/org/jolokia/jolokia-agent-jvm/2.2.0/jolokia-agent-jvm-2.2.0-javaagent.jar
    dest: /opt/observability/jolokia-agent.jar
    mode: '0644'

- name: Déployer le broker Kafka dédié aux signaux OTel
  ansible.builtin.template:
    src: "{{ role_path }}/templates/kafka.container.j2"
    dest: /etc/containers/systemd/observability-otel-kafka.container
    mode: '0644'
  register: otel_kafka_template

- name: Démarrer le broker Kafka OTel
  ansible.builtin.systemd_service:
    name: observability-otel-kafka.service
    daemon_reload: true
    enabled: true
    state: restarted
  when: otel_kafka_template.changed

- name: Recharger systemd après le déploiement du broker Kafka OTel
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: S'assurer que le broker Kafka OTel est actif
  ansible.builtin.systemd_service:
    name: observability-otel-kafka.service
    enabled: true
    state: started

- name: Arrêter l’ancien Gateway OTEL du backend
  ansible.builtin.systemd_service:
    name: observability-otel-gateway.service
    state: stopped
    enabled: false
  failed_when: false

- name: Retirer l’ancienne unité Gateway OTEL du backend
  ansible.builtin.file:
    path: /etc/containers/systemd/observability-otel-gateway.container
    state: absent

- name: Déployer la configuration de l'exporteur OTEL backend
  ansible.builtin.template:
    src: "{{ role_path }}/templates/kafka-exporter.yaml.j2"
    dest: /etc/observability/otel-kafka-exporter.yaml
    mode: '0644'
  vars:
    otel_kafka_broker: "127.0.0.1:9092"
    elasticsearch_url: "http://{{ elk_ip }}:9200"
    apm_server_url: "http://{{ elk_ip }}:8200"

- name: Déployer la clé API de l'exporteur OTEL backend
  ansible.builtin.copy:
    content: |
      ELASTICSEARCH_API_KEY={{ otel_elasticsearch_api_key }}
      APM_SERVER_SECRET_TOKEN={{ apm_server_secret_token | default(elastic_password | hash('sha256'), true) }}
    dest: /etc/observability/otel-kafka-exporter.env
    mode: '0600'
  no_log: true

- name: Déployer les unités OTEL backend
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item.template }}.container.j2"
    dest: "/etc/containers/systemd/{{ item.unit }}.container"
    mode: '0644'
  loop:
    - {template: kafka-exporter, unit: observability-otel-kafka-exporter}

- name: Recharger systemd pour les unités OTEL backend
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Démarrer le backend OTEL
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    enabled: true
    state: restarted
  loop: [observability-otel-kafka-exporter]

- name: Vérifier la santé de l'exporteur Kafka OTEL
  ansible.builtin.uri:
    url: http://127.0.0.1:13134/
    status_code: 200
  register: otel_exporter_health
  retries: 30
  delay: 2
  until: otel_exporter_health.status == 200
