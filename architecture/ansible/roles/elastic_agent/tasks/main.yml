---
- name: Déterminer l’architecture Elastic Agent
  ansible.builtin.set_fact:
    elastic_agent_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x86_64' }}"

- name: Vérifier l’installation et le mode EDOT de l’agent
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/Elastic/Agent/elastic-agent
    - /etc/observability/elastic-agent-otel.mode
  register: elastic_agent_state

- name: Déterminer la transition depuis Fleet classique
  ansible.builtin.set_fact:
    elastic_agent_binary_exists: "{{ elastic_agent_state.results[0].stat.exists }}"
    elastic_agent_otel_configured: "{{ elastic_agent_state.results[1].stat.exists }}"
    elastic_agent_otel_install_required: >-
      {{ not elastic_agent_state.results[0].stat.exists or
         (elastic_agent_state.results[0].stat.exists and not elastic_agent_state.results[1].stat.exists) or
         (elastic_agent_reinstall | default(false) | bool) }}

- name: Créer le répertoire d’état de l’agent EDOT
  ansible.builtin.file:
    path: /var/lib/observability/elastic-agent-otel
    state: directory
    owner: root
    mode: '0755'

- name: Arrêter l’agent avant sa conversion en mode EDOT
  ansible.builtin.systemd_service:
    name: elastic-agent.service
    state: stopped
    enabled: false
  when:
    - elastic_agent_binary_exists
    - not elastic_agent_otel_configured or elastic_agent_reinstall | default(false) | bool
  failed_when: false

- name: Désinstaller l’agent Fleet avant sa conversion en mode EDOT
  ansible.builtin.command:
    argv:
      - /opt/Elastic/Agent/elastic-agent
      - uninstall
      - --force
  when:
    - elastic_agent_binary_exists
    - not elastic_agent_otel_configured or elastic_agent_reinstall | default(false) | bool
  no_log: true
  failed_when: false

- name: Télécharger Elastic Agent pour le mode EDOT
  ansible.builtin.get_url:
    url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
    dest: "/var/cache/observability/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
    mode: '0644'
    force: false
    timeout: "{{ elastic_agent_download_timeout | default(120) }}"
  when: elastic_agent_otel_install_required
  register: elastic_agent_download
  retries: "{{ elastic_agent_download_retries | default(5) }}"
  delay: "{{ elastic_agent_download_delay | default(15) }}"
  until: elastic_agent_download is succeeded

- name: Extraire Elastic Agent
  ansible.builtin.unarchive:
    src: "/var/cache/observability/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
    dest: /var/tmp
    remote_src: true
  when: elastic_agent_otel_install_required

- name: Installer Elastic Agent comme service standalone EDOT
  ansible.builtin.command:
    argv:
      - "/var/tmp/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}/elastic-agent"
      - install
      - --non-interactive
      - --force
  when: elastic_agent_otel_install_required
  no_log: true

- name: Déployer la configuration EDOT de l’agent
  block:
    - name: Lire l’identifiant OpAMP persistant
      ansible.builtin.slurp:
        src: /var/lib/observability/elastic-agent-otel/opamp-instance-uid
      register: opamp_instance_uid_file
      when: fleet_enrollment_token | default('') | length > 0
      failed_when: false

    - name: Générer un identifiant OpAMP pour la VM
      ansible.builtin.command: uuidgen
      register: opamp_instance_uid_generated
      changed_when: true
      when:
        - fleet_enrollment_token | default('') | length > 0
        - opamp_instance_uid_file.content is not defined

    - name: Conserver l’identifiant OpAMP de la VM
      ansible.builtin.copy:
        content: "{{ opamp_instance_uid_generated.stdout | default(opamp_instance_uid_file.content | b64decode | trim) }}\n"
        dest: /var/lib/observability/elastic-agent-otel/opamp-instance-uid
        owner: root
        mode: '0600'
      when:
        - fleet_enrollment_token | default('') | length > 0
        - opamp_instance_uid_generated.stdout is defined

    - name: Définir l’identifiant OpAMP utilisé par l’agent
      ansible.builtin.set_fact:
        opamp_instance_uid: "{{ opamp_instance_uid_generated.stdout | default(opamp_instance_uid_file.content | b64decode | trim) }}"
      when: fleet_enrollment_token | default('') | length > 0

    - name: Déployer la configuration EDOT de l’agent
      ansible.builtin.template:
        src: elastic-agent.yml.j2
        dest: /opt/Elastic/Agent/elastic-agent.yml
        owner: root
        mode: '0600'
      register: elastic_agent_configuration

- name: Déclarer le mode EDOT actif
  ansible.builtin.copy:
    content: "edot\n"
    dest: /etc/observability/elastic-agent-otel.mode
    owner: root
    mode: '0644'

- name: Redémarrer l’agent après changement de configuration
  ansible.builtin.systemd_service:
    name: elastic-agent.service
    enabled: true
    state: restarted
  when: elastic_agent_configuration.changed or elastic_agent_otel_install_required

- name: Vérifier la santé de l’agent EDOT
  ansible.builtin.command:
    argv: [/opt/Elastic/Agent/elastic-agent, status]
  register: elastic_agent_status
  changed_when: false
  retries: 12
  delay: 5
  until: elastic_agent_status.rc == 0
