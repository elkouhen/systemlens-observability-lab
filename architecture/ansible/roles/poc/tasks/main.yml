---
- name: Créer les répertoires de logs des middlewares
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/log/mongodb, mode: '0755'}
    - {path: /var/log/kafka, mode: '0777'}
    - {path: /var/log/postgresql, mode: '0777'}

- name: Créer le fichier de log MongoDB
  ansible.builtin.file:
    path: /var/log/mongodb/mongod.log
    state: touch
    mode: '0666'
    modification_time: preserve
    access_time: preserve

- name: Télécharger l'agent Jolokia pour Kafka
  ansible.builtin.get_url:
    url: https://repo1.maven.org/maven2/org/jolokia/jolokia-agent-jvm/2.2.0/jolokia-agent-jvm-2.2.0-javaagent.jar
    dest: /opt/observability/jolokia-agent.jar
    mode: '0644'

- name: Déployer les middlewares du POC
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item.template }}.container.j2"
    dest: "/etc/containers/systemd/{{ item.unit }}.container"
    mode: '0644'
  register: poc_templates
  loop:
    - {template: mongodb, unit: observability-mongodb}
    - {template: kafka, unit: observability-kafka}
    - {template: postgresql, unit: observability-postgresql}

- name: Redémarrer Kafka après modification de sa déclaration
  ansible.builtin.systemd_service:
    name: observability-kafka
    daemon_reload: true
    state: restarted
  when: poc_templates.results[1].changed

- name: Redémarrer PostgreSQL après modification de sa déclaration
  ansible.builtin.systemd_service:
    name: observability-postgresql
    daemon_reload: true
    state: restarted
  when: poc_templates.results[2].changed

- name: Recharger systemd pour les unités Quadlet du POC
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Démarrer les middlewares du POC
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    enabled: true
    state: started
  loop: [observability-mongodb, observability-kafka, observability-postgresql]

- name: Activer les statistiques PostgreSQL pour le dashboard Query Latency
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - observability-postgresql
      - psql
      - -U
      - "{{ postgresql_user }}"
      - -d
      - "{{ postgresql_database }}"
      - -c
      - CREATE EXTENSION IF NOT EXISTS pg_stat_statements
  register: pg_stat_statements_extension
  changed_when: "'CREATE EXTENSION' in pg_stat_statements_extension.stdout"

- name: Configurer l’utilisateur de supervision PostgreSQL OTel
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - observability-postgresql
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -U
      - "{{ postgresql_user }}"
      - -d
      - "{{ postgresql_database }}"
      - -c
      - >-
        DO $do$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ postgresql_otel_user }}') THEN
            CREATE ROLE "{{ postgresql_otel_user }}" LOGIN PASSWORD '{{ postgresql_otel_password | replace("'", "''") }}';
          ELSE
            ALTER ROLE "{{ postgresql_otel_user }}" WITH LOGIN PASSWORD '{{ postgresql_otel_password | replace("'", "''") }}';
          END IF;
        END
        $do$;
        GRANT pg_monitor TO "{{ postgresql_otel_user }}";
        GRANT SELECT ON pg_catalog.pg_stat_database TO "{{ postgresql_otel_user }}";
        GRANT SELECT ON pg_catalog.pg_stat_activity TO "{{ postgresql_otel_user }}";
        GRANT SELECT ON pg_stat_statements TO "{{ postgresql_otel_user }}";
  register: postgresql_otel_user_config
  changed_when: false
  no_log: true

- name: Créer l’utilisateur de supervision MongoDB OTel
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - observability-mongodb
      - mongosh
      - --quiet
      - --host
      - 127.0.0.1
      - --eval
      - >-
        const admin = db.getSiblingDB('admin');
        const user = admin.getUser('{{ mongodb_otel_user }}');
        if (user === null) {
          admin.createUser({user: '{{ mongodb_otel_user }}', pwd: '{{ mongodb_otel_password | replace("'", "\\'") }}', roles: [{role: 'clusterMonitor', db: 'admin'}]});
          print('created');
        } else {
          admin.updateUser('{{ mongodb_otel_user }}', {pwd: '{{ mongodb_otel_password | replace("'", "\\'") }}', roles: [{role: 'clusterMonitor', db: 'admin'}]});
          print('updated');
        }
  register: mongodb_otel_user_config
  changed_when: "'created' in mongodb_otel_user_config.stdout"
  no_log: true

- name: Redémarrer l’agent EDOT après la création des comptes de supervision
  ansible.builtin.systemd_service:
    name: elastic-agent.service
    state: restarted
  when: postgresql_otel_user_config.changed or mongodb_otel_user_config.changed
