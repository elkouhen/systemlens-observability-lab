---
- name: Préparer les stockages persistants du stack ELK
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - /var/lib/observability/elasticsearch

- name: Générer les clés Kibana uniquement lors du premier provisioning
  ansible.builtin.shell: |
    if test ! -s /etc/observability/kibana.keys; then
      umask 077
      printf '%s\n%s\n%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > /etc/observability/kibana.keys
    fi
  args:
    executable: /bin/bash
  no_log: true

- name: Lire les clés Kibana locales
  ansible.builtin.slurp:
    src: /etc/observability/kibana.keys
  register: kibana_keys
  no_log: true

- name: Définir les clés Kibana du rendu local
  ansible.builtin.set_fact:
    kibana_encryption_key: "{{ (kibana_keys.content | b64decode).split('\n')[0] }}"
    kibana_security_key: "{{ (kibana_keys.content | b64decode).split('\n')[1] }}"
    kibana_reporting_key: "{{ (kibana_keys.content | b64decode).split('\n')[2] }}"
  no_log: true

- name: Déployer les unités Elastic sur elk-01
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item.template }}.container.j2"
    dest: "/etc/containers/systemd/{{ item.unit }}.container"
    mode: '0644'
  loop:
    - {template: elasticsearch, unit: observability-elasticsearch}
    - {template: apm-server, unit: observability-apm-server}
    - {template: kibana, unit: observability-kibana}
  notify: Redémarrer Kibana après modification de sa définition

- name: Déployer la configuration APM Server
  ansible.builtin.template:
    src: "{{ role_path }}/templates/apm-server.yml.j2"
    dest: /etc/observability/apm-server.yml
    mode: '0644'

- name: Écrire les identifiants APM Server
  ansible.builtin.copy:
    content: |
      ELASTICSEARCH_USERNAME=elastic
      ELASTICSEARCH_PASSWORD={{ elastic_password }}
      APM_SERVER_SECRET_TOKEN={{ elastic_password | hash('sha256') }}
    dest: /etc/observability/apm-server.env
    mode: '0600'
  no_log: true

- name: Déployer la configuration Kibana
  ansible.builtin.template:
    src: "{{ role_path }}/templates/kibana.yml.j2"
    dest: /etc/observability/kibana.yml
    mode: '0644'

- name: Écrire les identifiants Elasticsearch
  ansible.builtin.copy:
    content: "ELASTIC_PASSWORD={{ elastic_password }}\n"
    dest: /etc/observability/elasticsearch.env
    mode: '0600'
  no_log: true

- name: Recharger systemd pour les unités Elastic
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Démarrer Elasticsearch sur elk-01
  ansible.builtin.systemd_service:
    name: observability-elasticsearch.service
    enabled: true
    state: started

- name: Attendre Elasticsearch sur elk-01
  ansible.builtin.uri:
    url: http://127.0.0.1:9200
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    status_code: 200
  register: elasticsearch_ready
  retries: 30
  delay: 2
  until: elasticsearch_ready.status == 200

- name: Réinitialiser le token de service Kibana
  ansible.builtin.uri:
    url: http://127.0.0.1:9200/_security/service/elastic/kibana/credential/token/kibana
    method: DELETE
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  no_log: true

- name: Créer le token de service Kibana
  ansible.builtin.uri:
    url: http://127.0.0.1:9200/_security/service/elastic/kibana/credential/token/kibana
    method: POST
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: kibana_token_response
  no_log: true

- name: Déployer le token de service Kibana
  ansible.builtin.copy:
    content: "ELASTICSEARCH_SERVICEACCOUNTTOKEN={{ kibana_token_response.json.token.value }}\n"
    dest: /etc/observability/kibana.env
    mode: '0600'
  no_log: true

- name: Redémarrer APM Server et Kibana sur elk-01
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    enabled: true
    state: restarted
  loop: [observability-apm-server, observability-kibana]

- name: Attendre APM Server sur elk-01
  ansible.builtin.uri:
    url: http://127.0.0.1:8200/
    status_code: 200
  register: apm_server_ready
  retries: 30
  delay: 2
  until: apm_server_ready.status == 200
