---
# Tables de routage du collecteur Edge (ADR-015) : le cluster et ses
# namespaces viennent de group_vars, les VM rattachées de l'inventaire
# (hôtes dont otel_edge désigne cet Edge). Les formats sont contrôlés ici,
# rien n'est normalisé à l'exécution.
- name: Déterminer les VM rattachées à ce collecteur Edge
  ansible.builtin.set_fact:
    otel_edge_hosts: >-
      {{ groups['all'] | map('extract', hostvars)
         | selectattr('otel_edge', 'defined')
         | selectattr('otel_edge', 'equalto', inventory_hostname)
         | map(attribute='inventory_hostname') | sort }}

- name: Vérifier les tables de routage du Collecteur EDOT Edge
  vars:
    otel_edge_platforms: >-
      {{ otel_edge_namespace_routes | map(attribute='platform', default='') | list
         + [otel_edge_cluster.platform | default('')]
         + otel_edge_hosts | map('extract', hostvars, 'otel_platform') | map('default', '') | list }}
    otel_edge_environments: >-
      {{ otel_edge_namespace_routes | map(attribute='environment', default='') | list
         + [otel_edge_cluster.environment | default('')]
         + otel_edge_hosts | map('extract', hostvars, 'otel_environment') | map('default', '') | list }}
  ansible.builtin.assert:
    that:
      - otel_edge_cluster.name | default('') | length > 0
      - otel_edge_cluster.kubernetes_namespace | default('') | length > 0
      - otel_edge_namespace_routes | map(attribute='kubernetes_namespace', default='') | select | list | length == otel_edge_namespace_routes | length
      - (otel_edge_namespace_routes | map(attribute='kubernetes_namespace', default='') | list + [otel_edge_cluster.kubernetes_namespace]) | unique | list | length == otel_edge_namespace_routes | length + 1
      - otel_edge_platforms | select('match', '^[a-z0-9_]+$') | list | length == otel_edge_platforms | length
      - otel_edge_environments | select('match', '^[a-z0-9_]+$') | list | length == otel_edge_environments | length
      - otel_edge_hosts | length > 0
    fail_msg: >-
      Tables de routage Edge invalides : otel_edge_cluster déclare name,
      kubernetes_namespace, platform et environment ; chaque entrée de
      otel_edge_namespace_routes déclare un kubernetes_namespace unique,
      platform et environment ([a-z0-9_]) ; chaque VM rattachée ({{ otel_edge_hosts | join(', ') }})
      déclare otel_platform et otel_environment ([a-z0-9_]).
    quiet: true
