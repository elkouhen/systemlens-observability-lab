---
- name: Déployer le frontal otel-edge
  ansible.builtin.template:
    src: "{{ role_path }}/templates/haproxy.cfg.j2"
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
    validate: haproxy -c -f %s

- name: Vérifier les tables de routage du Collecteur EDOT Edge
  ansible.builtin.import_tasks: routes.yml

- name: Déployer la configuration du Collecteur EDOT Edge
  ansible.builtin.template:
    src: "{{ role_path }}/templates/otel-edge.yaml.j2"
    dest: /etc/observability/otel-edge.yaml
    mode: '0644'

- name: Déployer les identifiants Kafka OTel du producteur Edge
  ansible.builtin.copy:
    content: |
      OTEL_KAFKA_PUBLISHER_USERNAME={{ otel_kafka_publisher_username }}
      OTEL_KAFKA_PUBLISHER_PASSWORD={{ otel_kafka_publisher_password }}
    dest: /etc/observability/otel-edge.env
    mode: '0600'
  no_log: true

# Chaque VM rattachée (routes.yml) apporte sa clé OTEL_EDGE_KEY_<HOST> ; les
# deux collecteurs Kubernetes gardent leurs clés propres.
- name: Vérifier les clés des clients Edge
  ansible.builtin.assert:
    that:
      - otel_edge_hosts | length > 0
      - otel_edge_hosts | map('extract', hostvars, 'otel_edge_client_key') | select | list | length == otel_edge_hosts | length
      - otel_edge_key_kubernetes | default('') | length > 0
      - otel_edge_key_kubernetes_cluster | default('') | length > 0
    fail_msg: >-
      Chaque VM rattachée à {{ inventory_hostname }}
      ({{ otel_edge_hosts | join(', ') }}) fournit sa clé OTEL_EDGE_KEY_<HOST>,
      et OTEL_EDGE_KEY_KUBERNETES et OTEL_EDGE_KEY_KUBERNETES_CLUSTER sont
      requises.
    quiet: true

- name: Déployer les clés des clients Edge
  ansible.builtin.template:
    src: "{{ role_path }}/templates/otel-edge.tokens.j2"
    dest: /etc/observability/otel-edge.tokens
    # L'image EDOT s'exécute avec elastic-agent (UID/GID 1000). Conserver
    # 0600 tout en permettant au processus du conteneur de lire le secret.
    owner: '1000'
    group: '1000'
    mode: '0600'
  no_log: true

# File persistante de l'exporteur Kafka (file_storage). L'image EDOT
# s'exécute avec elastic-agent (UID/GID 1000), qui doit pouvoir y écrire.
- name: Autoriser le Collecteur EDOT Edge à écrire son file_storage
  ansible.builtin.file:
    path: /var/lib/observability/otel-edge
    state: directory
    owner: '1000'
    group: '1000'
    mode: 'u=rwX,g=rX,o='
    recurse: true

- name: Déployer l'unité du Collecteur EDOT Edge
  ansible.builtin.template:
    src: "{{ role_path }}/templates/otel-edge.container.j2"
    dest: /etc/containers/systemd/observability-otel-edge.container
    mode: '0644'

- name: Vérifier la génération de l'unité Quadlet Edge
  ansible.builtin.command:
    argv: ["{{ podman_system_generator_path }}", --dryrun]
  environment:
    QUADLET_UNIT_DIRS: /etc/containers/systemd
  changed_when: false

- name: Créer le répertoire des overrides systemd HAProxy
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    mode: '0755'

- name: Déployer le runtime du socket HAProxy
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd-runtime-directory.conf.j2"
    dest: /etc/systemd/system/haproxy.service.d/runtime-directory.conf
    mode: '0644'

- name: Recharger systemd pour HAProxy
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Démarrer le Collecteur EDOT Edge
  ansible.builtin.systemd_service:
    name: observability-otel-edge.service
    state: restarted

- name: Démarrer HAProxy otel-edge
  ansible.builtin.systemd_service:
    name: haproxy.service
    enabled: true
    state: restarted

- name: Vérifier la configuration HAProxy otel-edge
  ansible.builtin.command: haproxy -c -f /etc/haproxy/haproxy.cfg
  changed_when: false

- name: Vérifier la santé du Collecteur EDOT Edge
  ansible.builtin.uri:
    url: http://127.0.0.1:13135/
    status_code: 200
  register: otel_edge_health
  retries: 30
  delay: 2
  until: otel_edge_health.status == 200
