---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: elastic-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-cluster-collector
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-cluster-collector
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - nodes/spec
      - pods
      - replicationcontrollers
      - resourcequotas
      - services
      - persistentvolumes
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-cluster-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-cluster-collector
subjects:
  - kind: ServiceAccount
    name: otel-cluster-collector
    namespace: elastic-stack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-kafka-config
  namespace: elastic-stack
data:
  daemonset.yaml: |
    # Ce collecteur ne lit plus les fichiers de logs des pods : les
    # applications Java exportent leurs logs en OTLP par l'agent OTel
    # (ADR-012). apps/ADDING_APPLICATION.md décrit le receiver filelog à
    # rétablir pour une application d'un autre namespace qui ne peut écrire
    # que sur stdout. Il ne collecte plus non plus les métriques de l'hôte :
    # l'agent EDOT de la VM k3s-01 s'en charge, comme pour toute VM (ADR-015).
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      # Télémétrie interne du collecteur, lue sur son propre endpoint
      # Prometheus toutes les 30 s (ADR-013).
      prometheus/internal:
        config:
          scrape_configs:
            - job_name: otel-kubernetes
              scrape_interval: 30s
              static_configs:
                - targets: [127.0.0.1:8888]
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 15s
        # Le nom Kubernetes du nœud n'est pas garanti résolvable depuis le
        # réseau du pod. L'IP fournie par Downward API atteint directement le
        # kubelet du nœud qui exécute ce DaemonSet.
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        node: ${env:K8S_NODE_NAME}
        k8s_api_config:
          auth_type: serviceAccount
        metric_groups: [node, pod, container, volume]
        extra_metadata_labels: [container.id]
        # Métriques optionnelles lues par les dashboards [Kubernetes OTel] ;
        # émises uniquement pour les pods qui déclarent des limites.
        metrics:
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        timeout: 1s
        send_batch_size: 512
      resource/k8s_cluster:
        attributes:
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
      # Marqueur lu puis supprimé par le collecteur Edge (ADR-015) : les
      # métriques de ce collecteur, y compris celles des pods applicatifs,
      # vont dans la plateforme du cluster. L'Edge pose aussi
      # deployment.environment.name et k8s.cluster.name.
      resource/edge-source:
        attributes:
          - key: otel.edge.source
            value: kubernetes
            action: upsert
    exporters:
      otlp/edge:
        endpoint: http://otel-edge-vm.elastic-stack.svc.cluster.local:4317
        tls:
          insecure: true
        headers:
          Authorization: "Bearer ${env:OTEL_EDGE_API_KEY}"
    service:
      extensions: [health_check]
      telemetry:
        resource:
          service.name: otel-kubernetes
          deployment.environment.name: homologation
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        metrics:
          receivers: [kubeletstats, prometheus/internal]
          processors: [memory_limiter, resource/k8s_cluster, resource/edge-source, batch]
          exporters: [otlp/edge]

  cluster.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 15s
        # Requis par les dashboards [Kubernetes OTel] pour calculer la
        # saturation CPU et mémoire des nœuds.
        allocatable_types_to_report: [cpu, memory]
        # Requis par les dashboards [Kubernetes OTel] : pression mémoire des
        # nœuds et raison du dernier arrêt des conteneurs.
        node_conditions_to_report: [Ready, MemoryPressure]
        resource_attributes:
          k8s.container.status.last_terminated_reason:
            enabled: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50
      batch:
        timeout: 1s
        send_batch_size: 256
      resource/k8s_cluster:
        attributes:
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
      # Marqueur lu puis supprimé par le collecteur Edge (ADR-015) : les
      # métriques de ce collecteur vont dans la plateforme du cluster.
      resource/edge-source:
        attributes:
          - key: otel.edge.source
            value: kubernetes
            action: upsert
    exporters:
      otlp/edge:
        endpoint: http://otel-edge-vm.elastic-stack.svc.cluster.local:4317
        tls:
          insecure: true
        headers:
          Authorization: "Bearer ${env:OTEL_EDGE_API_KEY}"
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resource/k8s_cluster, resource/edge-source, batch]
          exporters: [otlp/edge]

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-kubernetes
  namespace: elastic-stack
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: otel-kubernetes}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-kubernetes}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.4
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args: ["--config=/etc/otel/daemonset.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_CLUSTER_NAME
              value: k3s-01
            - name: OTEL_EDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-edge-client-keys
                  key: otel-kubernetes
          ports:
            - {name: health, containerPort: 13133}
            - {name: metrics, containerPort: 8888}
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
          readinessProbe: {httpGet: {path: /, port: health}}
          livenessProbe: {httpGet: {path: /, port: health}}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 1, memory: 768Mi}
      volumes:
        - name: config
          configMap: {name: otel-kafka-config}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-kubernetes-cluster
  namespace: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-kubernetes-cluster}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-kubernetes-cluster}
    spec:
      serviceAccountName: otel-cluster-collector
      containers:
        - name: collector
          env:
            - name: K8S_CLUSTER_NAME
              value: k3s-01
            - name: OTEL_EDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-edge-client-keys
                  key: otel-kubernetes-cluster
          image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args: ["--config=/etc/otel/cluster.yaml"]
          ports:
            - {name: health, containerPort: 13133}
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
          readinessProbe: {tcpSocket: {port: health}}
          livenessProbe: {tcpSocket: {port: health}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: otel-kafka-config}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: otel-telemetry-topics
  namespace: elastic-stack
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-telemetry-topics
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              for topic in supermarket.order.placed supermarket.stock.depleted supermarket.stock.restock-requested; do
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server
              192.168.33.10:9092 --create --if-not-exists --topic "$topic"
              --partitions 1 --replication-factor 1
              --config min.insync.replicas=1;
              done
