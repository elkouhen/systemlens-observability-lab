# Topics métier du Kafka de supermarket-middleware-01 (ADR-015). Les
# collecteurs Kubernetes sont déployés par le chart opentelemetry-kube-stack
# (platform/helm/opentelemetry-kube-stack-values.yaml, ADR-019).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: otel-telemetry-topics
  namespace: elastic-stack
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-telemetry-topics
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              for topic in supermarket.order.placed supermarket.stock.depleted supermarket.stock.restock-requested; do
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server
              192.168.33.10:9092 --create --if-not-exists --topic "$topic"
              --partitions 1 --replication-factor 1
              --config min.insync.replicas=1;
              done
