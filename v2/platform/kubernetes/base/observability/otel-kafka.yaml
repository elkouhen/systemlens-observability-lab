---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: elastic-stack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-kafka-config
  namespace: elastic-stack
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        timeout: 1s
        send_batch_size: 512

    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
      k8s_cluster: {}

    exporters:
      kafka/traces:
        brokers: ["192.168.33.10:9092", "192.168.33.11:9092", "192.168.33.12:9092"]
        topic: otel-traces
        encoding: otlp_proto
      kafka/metrics:
        brokers: ["192.168.33.10:9092", "192.168.33.11:9092", "192.168.33.12:9092"]
        topic: otel-metrics
        encoding: otlp_proto
      kafka/logs:
        brokers: ["192.168.33.10:9092", "192.168.33.11:9092", "192.168.33.12:9092"]
        topic: otel-logs
        encoding: otlp_proto

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [kafka/traces]
        metrics:
          receivers: [otlp, k8s_cluster]
          processors: [memory_limiter, batch]
          exporters: [kafka/metrics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [kafka/logs]

  daemonset.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog/kubernetes:
        include: [/var/log/pods/*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
      hostmetrics:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          cpu: {}
          disk: {}
          filesystem: {}
          load: {}
          memory: {}
          network: {}
          paging: {}
          processes: {}
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.container.name]
      batch:
        timeout: 1s
        send_batch_size: 512
    exporters:
      kafka/logs:
        brokers: ["192.168.33.10:9092", "192.168.33.11:9092", "192.168.33.12:9092"]
        topic: otel-logs
        encoding: otlp_proto
      kafka/metrics:
        brokers: ["192.168.33.10:9092", "192.168.33.11:9092", "192.168.33.12:9092"]
        topic: otel-metrics
        encoding: otlp_proto
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog/kubernetes]
          processors: [k8sattributes, batch]
          exporters: [kafka/logs]
        metrics:
          receivers: [hostmetrics]
          processors: [batch]
          exporters: [kafka/metrics]

  exporter.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      kafka/traces:
        brokers: ["192.168.33.10:9092", "192.168.33.11:9092", "192.168.33.12:9092"]
        protocol_version: 3.9.0
        topic: otel-traces
        encoding: otlp_proto
        group_id: otel-traces-elasticsearch
      kafka/metrics:
        brokers: ["192.168.33.10:9092", "192.168.33.11:9092", "192.168.33.12:9092"]
        protocol_version: 3.9.0
        topic: otel-metrics
        encoding: otlp_proto
        group_id: otel-metrics-elasticsearch
      kafka/logs:
        brokers: ["192.168.33.10:9092", "192.168.33.11:9092", "192.168.33.12:9092"]
        protocol_version: 3.9.0
        topic: otel-logs
        encoding: otlp_proto
        group_id: otel-logs-elasticsearch
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 700
        spike_limit_mib: 150
      batch:
        timeout: 1s
        send_batch_size: 512
    exporters:
      otlphttp/elasticsearch:
        endpoint: https://elasticsearch-es-http.elastic-stack.svc:9200/_otlp
        headers:
          Authorization: "ApiKey ${env:ELASTICSEARCH_API_KEY}"
        tls:
          ca_file: /etc/otel/elasticsearch-ca/ca.crt
        sending_queue:
          enabled: true
          queue_size: 1000
          storage: file_storage
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
    extensions:
      file_storage:
        directory: /var/lib/otel
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check, file_storage]
      pipelines:
        traces:
          receivers: [kafka/traces]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/elasticsearch]
        metrics:
          receivers: [kafka/metrics]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/elasticsearch]
        logs:
          receivers: [kafka/logs]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/elasticsearch]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-gateway}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.153.0
          args: ["--config=/etc/otel/collector.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          volumeMounts:
            - {name: config, mountPath: /etc/otel/collector.yaml, subPath: collector.yaml, readOnly: true}
          readinessProbe: {httpGet: {path: /, port: health}}
      volumes:
        - name: config
          configMap: {name: otel-kafka-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: elastic-stack
spec:
  selector: {app.kubernetes.io/name: otel-gateway}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-kubernetes
  namespace: elastic-stack
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: otel-kubernetes}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-kubernetes}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.153.0
          securityContext: {runAsUser: 0}
          args: ["--config=/etc/otel/daemonset.yaml"]
          ports: [{name: health, containerPort: 13133}]
          volumeMounts:
            - {name: config, mountPath: /etc/otel/daemonset.yaml, subPath: daemonset.yaml, readOnly: true}
            - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
            - {name: hostfs, mountPath: /hostfs, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-kafka-config}
        - name: varlogpods
          hostPath: {path: /var/log/pods}
        - name: hostfs
          hostPath: {path: /}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-kafka-exporter
  namespace: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-kafka-exporter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-kafka-exporter}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.153.0
          args: ["--config=/etc/otel/exporter.yaml"]
          env:
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef: {name: otel-elasticsearch-credentials, key: api-key}
          ports: [{name: health, containerPort: 13133}]
          volumeMounts:
            - {name: config, mountPath: /etc/otel/exporter.yaml, subPath: exporter.yaml, readOnly: true}
            - {name: ca, mountPath: /etc/otel/elasticsearch-ca, readOnly: true}
            - {name: queue, mountPath: /var/lib/otel}
      volumes:
        - name: config
          configMap: {name: otel-kafka-config}
        - name: ca
          secret: {secretName: elasticsearch-es-http-certs-public}
        - name: queue
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: otel-telemetry-topics
  namespace: elastic-stack
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              for topic in otel-traces otel-metrics otel-logs; do
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server
              192.168.33.10:9092,192.168.33.11:9092,192.168.33.12:9092
              --create --if-not-exists --topic "$topic" --partitions 3
              --replication-factor 3 --config min.insync.replicas=2; done
