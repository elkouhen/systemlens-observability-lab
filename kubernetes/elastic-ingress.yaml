apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: eck-elasticsearch-https
  namespace: elastic-stack
spec:
  rootCAsSecrets:
    - elasticsearch-es-http-ca-internal
  serverName: elasticsearch-es-http.elastic-stack.svc
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: eck-kibana-https
  namespace: elastic-stack
spec:
  rootCAsSecrets:
    - es-kb-quickstart-eck-kibana-kb-http-ca-internal
  serverName: es-kb-quickstart-eck-kibana-kb-http.elastic-stack.svc
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: eck-fleet-https
  namespace: elastic-stack
spec:
  rootCAsSecrets:
    - fleet-server-agent-http-ca-internal
  serverName: fleet-server-agent-http.elastic-stack.svc
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: eck-apm-https
  namespace: elastic-stack
spec:
  rootCAsSecrets:
    - apm-server-apm-http-ca-internal
  serverName: apm-server-apm-http.elastic-stack.svc
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: elasticsearch
  namespace: elastic-stack
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`elasticsearch.poc.test`)
      services:
        - name: elasticsearch-es-http
          port: 9200
          scheme: https
          serversTransport: eck-elasticsearch-https
  tls:
    secretName: elastic-public-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kibana
  namespace: elastic-stack
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`kibana.poc.test`)
      services:
        - name: es-kb-quickstart-eck-kibana-kb-http
          port: 5601
          scheme: https
          serversTransport: eck-https
  tls:
    secretName: elastic-public-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fleet-server
  namespace: elastic-stack
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`fleet.poc.test`)
      services:
        - name: fleet-server-agent-http
          port: 8220
          scheme: https
          serversTransport: eck-fleet-https
  tls:
    secretName: elastic-public-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apm-server
  namespace: elastic-stack
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`apm.poc.test`)
      services:
        - name: apm-server-apm-http
          port: 8200
          scheme: https
          serversTransport: eck-apm-https
  tls:
    secretName: elastic-public-tls
