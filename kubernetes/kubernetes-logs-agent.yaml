apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-logs-agent
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-logs-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-logs-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-logs-agent
subjects:
  - kind: ServiceAccount
    name: kubernetes-logs-agent
    namespace: elastic-stack
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: kubernetes-logs
  namespace: elastic-stack
spec:
  version: 9.5.1
  mode: standalone
  serviceAccountName: kubernetes-logs-agent
  elasticsearchRefs:
    - name: elasticsearch
  daemonSet:
    podTemplate:
      spec:
        containers:
          - name: agent
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
  config:
    inputs:
      - id: apm-demo-kafka-producer-jolokia
        type: jolokia/metrics
        streams:
          - id: apm-demo-kafka-producer
            data_stream: {type: metrics, dataset: kafka.producer}
            hosts: ["http://apm-demo-jolokia.apm-demo.svc:8775"]
            metrics_path: /jolokia
            period: 60s
      - id: apm-demo-kafka-consumer-jolokia
        type: jolokia/metrics
        streams:
          - id: apm-demo-kafka-consumer
            data_stream: {type: metrics, dataset: kafka.consumer}
            hosts: ["http://apm-demo-worker-jolokia.apm-demo.svc:8774"]
            metrics_path: /jolokia
            period: 60s
      - id: apm-demo-container-logs
        type: filestream
        streams:
          - id: apm-demo-container-logs-stream
            data_stream:
              type: logs
              dataset: kubernetes.container_logs
            paths:
              - /var/log/containers/*_apm-demo_*.log
            prospector.scanner.symlinks: true
            parsers:
              - container:
                  stream: all
                  format: auto
            processors:
              - add_kubernetes_metadata:
                  host: ${NODE_NAME}
                  matchers:
                    - logs_path:
                        logs_path: /var/log/containers/
              - decode_json_fields:
                  fields: ["message"]
                  target: ""
                  overwrite_keys: true
                  expand_keys: true
              # Le Java agent OpenTelemetry renseigne le MDC avec les noms
              # trace_id/span_id. Les normaliser ici conserve un JSON ECS
              # strict dans Elasticsearch et active la navigation log-trace.
              - rename:
                  fields:
                    - from: trace_id
                      to: trace.id
                    - from: span_id
                      to: span.id
                    - from: trace_flags
                      to: labels.otel_trace_flags
                  ignore_missing: true
                  fail_on_error: false
