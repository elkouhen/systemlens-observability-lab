apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-logs-agent
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-logs-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-logs-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-logs-agent
subjects:
  - kind: ServiceAccount
    name: kubernetes-logs-agent
    namespace: elastic-stack
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: kubernetes-logs
  namespace: elastic-stack
spec:
  version: 9.5.1
  mode: standalone
  serviceAccountName: kubernetes-logs-agent
  elasticsearchRefs:
    - name: elasticsearch
  daemonSet:
    podTemplate:
      spec:
        containers:
          - name: agent
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
  config:
    inputs:
      - id: apm-demo-container-logs
        type: filestream
        streams:
          - id: apm-demo-container-logs-stream
            data_stream:
              type: logs
              dataset: kubernetes.container_logs
            paths:
              - /var/log/containers/*_apm-demo_*.log
            prospector.scanner.symlinks: true
            parsers:
              - container:
                  stream: all
                  format: auto
            processors:
              - add_kubernetes_metadata:
                  host: ${NODE_NAME}
                  matchers:
                    - logs_path:
                        logs_path: /var/log/containers/
              - decode_json_fields:
                  fields: ["message"]
                  target: ""
                  overwrite_keys: true
                  expand_keys: true
