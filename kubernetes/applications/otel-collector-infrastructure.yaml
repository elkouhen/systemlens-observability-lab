apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/stats", "nodes/pods", "pods", "namespaces", "replicationcontrollers", "resourcequotas", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: elastic-stack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-daemon-config
  namespace: elastic-stack
data:
  config.yaml: |
    receivers:
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          memory: {}
          load: {}
          disk: {}
          filesystem: {}
          network: {}
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 30s
        endpoint: ${env:HOST_IP}:10250
        node: ${env:NODE_NAME}
        insecure_skip_verify: true
        k8s_api_config:
          auth_type: serviceAccount
        metric_groups: [node, pod, container, volume]
        extra_metadata_labels: [container.id]
    processors:
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: poc-elastic
            action: upsert
      batch:
        timeout: 5s
    exporters:
      otlp/infra:
        endpoint: otel-collector-gateway.elastic-stack.svc:4319
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, kubeletstats]
          processors: [resourcedetection, resource/cluster, batch]
          exporters: [otlp/infra]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-daemon
  namespace: elastic-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector-daemon
    spec:
      serviceAccountName: otel-collector
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: collector
          image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.1
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-daemon-config
        - name: hostfs
          hostPath:
            path: /
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-cluster-config
  namespace: elastic-stack
data:
  config.yaml: |
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure]
        allocatable_types_to_report: [cpu, memory]
        metrics:
          k8s.pod.status_reason:
            enabled: true
    processors:
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: poc-elastic
            action: upsert
      batch:
        timeout: 5s
    exporters:
      otlp/infra:
        endpoint: otel-collector-gateway.elastic-stack.svc:4319
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [resource/cluster, batch]
          exporters: [otlp/infra]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-cluster
  namespace: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector-cluster
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.1
          args: ["--config=/etc/otelcol/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-cluster-config
