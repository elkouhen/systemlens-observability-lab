apiVersion: apm.k8s.elastic.co/v1
kind: ApmServer
metadata:
  name: apm-server
  namespace: elastic-stack
spec:
  version: 9.5.1
  count: 1
  # ECK configure automatiquement l'authentification et le TLS entre les
  # composants référencés.
  elasticsearchRef:
    name: elasticsearch
  # Requis à partir d'APM Server 8 pour l'application APM et la configuration
  # centrale des agents.
  kibanaRef:
    name: es-kb-quickstart-eck-kibana
  # Le sidecar Metricbeat collecte les statistiques internes et les publie
  # au format attendu par le dashboard [APM] Monitoring Overview.
  config:
    http:
      enabled: true
      host: 127.0.0.1
      port: 5066
    monitoring:
      enabled: false
  podTemplate:
    spec:
      containers:
        - name: apm-server
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
        - name: metricbeat-monitoring
          image: docker.elastic.co/beats/metricbeat:9.5.1
          args: ["-e", "-c", "/usr/share/metricbeat/metricbeat.yml"]
          env:
            - name: METRICBEAT_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metricbeat-monitoring-credentials
                  key: METRICBEAT_ES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: metricbeat-monitoring-config
              mountPath: /usr/share/metricbeat/metricbeat.yml
              subPath: metricbeat.yml
              readOnly: true
            - name: elasticsearch-certs
              mountPath: /usr/share/metricbeat/certs
              readOnly: true
      volumes:
        - name: metricbeat-monitoring-config
          configMap:
            name: metricbeat-monitoring-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metricbeat-monitoring-config
  namespace: elastic-stack
data:
  metricbeat.yml: |
    metricbeat.modules:
      - module: beat
        hosts: ["http://127.0.0.1:5066"]
        period: 10s
        xpack.enabled: true

    output.elasticsearch:
      hosts: ["https://elasticsearch-es-http.elastic-stack.svc:9200"]
      username: metricbeat_monitoring_writer
      password: "${METRICBEAT_ES_PASSWORD}"
      ssl.certificate_authorities: ["/usr/share/metricbeat/certs/ca.crt"]
