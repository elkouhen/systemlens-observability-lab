apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-gateway-config
  namespace: elastic-stack
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318

    processors:
      elasticapm:
      # Micrometer émet des histogrammes cumulatifs ; Elasticsearch OTEL les
      # indexe en temporality delta.
      cumulativetodelta:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 128
      batch:
        timeout: 5s
        send_batch_size: 8192

    connectors:
      elasticapm:

    exporters:
      elasticsearch/otel:
        endpoints: ["${env:ELASTIC_ENDPOINT}"]
        # L'exporter attend la valeur de l'en-tête ApiKey (id:clé encodé Base64).
        api_key: ${env:ELASTIC_API_KEY_BASE64}
        mapping:
          mode: otel
        tls:
          ca_file: /etc/otel/elasticsearch-ca/ca.crt
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 10000

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, elasticapm, batch]
          exporters: [elasticapm, elasticsearch/otel]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, cumulativetodelta, batch]
          exporters: [elasticsearch/otel]
        metrics/aggregated-metrics:
          receivers: [elasticapm]
          processors: [memory_limiter, batch]
          exporters: [elasticsearch/otel]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-gateway
  namespace: elastic-stack
  labels:
    app.kubernetes.io/name: otel-collector-gateway
spec:
  replicas: 2
  # Le POC tourne sur un nœud k3d unique. En production, conserver un surge
  # positif et réserver la capacité nécessaire pour un rollout sans réduction.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector-gateway
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.1
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ELASTIC_ENDPOINT
              value: https://elasticsearch-es-http.elastic-stack.svc:9200
            - name: ELASTIC_API_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: otel-collector-elasticsearch-api-key
                  key: api-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: health
          readinessProbe:
            httpGet:
              path: /
              port: health
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: elasticsearch-ca
              mountPath: /etc/otel/elasticsearch-ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-gateway-config
        - name: elasticsearch-ca
          secret:
            secretName: elasticsearch-es-http-certs-public
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-gateway
  namespace: elastic-stack
spec:
  selector:
    app.kubernetes.io/name: otel-collector-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector-gateway
  namespace: elastic-stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector-gateway
