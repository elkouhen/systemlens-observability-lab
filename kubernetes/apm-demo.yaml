apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-demo
  namespace: apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-demo
    spec:
      containers:
        - name: apm-demo
          image: apm-demo:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: jmx-producer
              containerPort: 8775
          env:
            - name: OTEL_SERVICE_NAME
              value: apm-demo
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=local
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://apm-server-apm-http.elastic-stack.svc:8200
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: APM_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apm-server-apm-token
                  key: secret-token
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: Authorization=Bearer $(APM_SERVER_TOKEN)
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /etc/otel/certs/ca.crt
            - name: APM_DEMO_WORKER_URL
              value: http://apm-demo-worker:3001
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.33.10:9092,192.168.33.11:9092,192.168.33.12:9092
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: apm-server-ca
              mountPath: /etc/otel/certs
              readOnly: true
      volumes:
        - name: apm-server-ca
          secret:
            secretName: apm-server-apm-http-certs-public
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo-jolokia
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo
  ports:
    - name: jolokia
      port: 8775
      targetPort: jmx-producer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-demo-worker
  namespace: apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-demo-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-demo-worker
    spec:
      containers:
        - name: apm-demo-worker
          image: apm-demo-worker:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
            - name: jmx-consumer
              containerPort: 8774
          env:
            - name: OTEL_SERVICE_NAME
              value: apm-demo-worker
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=local
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://apm-server-apm-http.elastic-stack.svc:8200
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: APM_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apm-server-apm-token
                  key: secret-token
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: Authorization=Bearer $(APM_SERVER_TOKEN)
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /etc/otel/certs/ca.crt
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://192.168.33.10:27017,192.168.33.11:27017,192.168.33.12:27017/observability_test?replicaSet=poc-rs
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.33.10:9092,192.168.33.11:9092,192.168.33.12:9092
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: apm-server-ca
              mountPath: /etc/otel/certs
              readOnly: true
      volumes:
        - name: apm-server-ca
          secret:
            secretName: apm-server-apm-http-certs-public
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo-worker
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo-worker
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo-worker-jolokia
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo-worker
  ports:
    - name: jolokia
      port: 8774
      targetPort: jmx-consumer
