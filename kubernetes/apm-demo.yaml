apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-demo
  namespace: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-demo
    spec:
      containers:
        - name: apm-demo
          image: apm-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ELASTIC_APM_SERVICE_NAME
              value: apm-demo
            - name: ELASTIC_APM_ENVIRONMENT
              value: local
            - name: ELASTIC_APM_SERVER_URL
              value: https://apm-server-apm-http.elastic-stack.svc:8200
            # ECK émet un certificat interne. À remplacer par une CA de
            # confiance et ELASTIC_APM_SERVER_CA_CERT_FILE en production.
            - name: ELASTIC_APM_VERIFY_SERVER_CERT
              value: "false"
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apm-server-apm-token
                  key: secret-token
            - name: WORKER_URL
              value: http://apm-demo-worker:3001/work
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo
  namespace: elastic-stack
spec:
  selector:
    app.kubernetes.io/name: apm-demo
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-demo-worker
  namespace: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-demo-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-demo-worker
    spec:
      containers:
        - name: apm-demo-worker
          image: apm-demo:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "start:worker"]
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: ELASTIC_APM_SERVICE_NAME
              value: apm-demo-worker
            - name: ELASTIC_APM_ENVIRONMENT
              value: local
            - name: ELASTIC_APM_SERVER_URL
              value: https://apm-server-apm-http.elastic-stack.svc:8200
            # ECK émet un certificat interne. À remplacer par une CA de
            # confiance et ELASTIC_APM_SERVER_CA_CERT_FILE en production.
            - name: ELASTIC_APM_VERIFY_SERVER_CERT
              value: "false"
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apm-server-apm-token
                  key: secret-token
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo-worker
  namespace: elastic-stack
spec:
  selector:
    app.kubernetes.io/name: apm-demo-worker
  ports:
    - name: http
      port: 3001
      targetPort: http
