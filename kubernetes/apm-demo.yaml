apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-demo
  namespace: apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-demo
    spec:
      containers:
        - name: apm-demo
          image: apm-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: jmx-producer
              containerPort: 8775
          env:
            - name: ELASTIC_APM_SERVICE_NAME
              value: apm-demo
            - name: ELASTIC_APM_ENVIRONMENT
              value: local
            - name: ELASTIC_APM_APPLICATION_PACKAGES
              value: io.systemlens.demo
            # Reserve une future collecte Jolokia interne au cluster hors des
            # transactions metier APM.
            - name: ELASTIC_APM_TRANSACTION_IGNORE_URLS
              value: /jolokia/*
            # Jolokia embarque le serveur HTTP du JDK, distinct du serveur
            # servlet Spring.
            - name: ELASTIC_APM_DISABLE_INSTRUMENTATIONS
              value: jdk-httpserver
            - name: ELASTIC_APM_SERVER_URL
              value: https://apm-server-apm-http.elastic-stack.svc:8200
            - name: ELASTIC_APM_VERIFY_SERVER_CERT
              value: "false"
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apm-server-apm-token
                  key: secret-token
            - name: APM_DEMO_WORKER_URL
              value: http://apm-demo-worker:3001
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.33.10:9092,192.168.33.11:9092,192.168.33.12:9092
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo-jolokia
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo
  ports:
    - name: jolokia
      port: 8775
      targetPort: jmx-producer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-demo-worker
  namespace: apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-demo-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-demo-worker
    spec:
      containers:
        - name: apm-demo-worker
          image: apm-demo-worker:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
            - name: jmx-consumer
              containerPort: 8774
          env:
            - name: ELASTIC_APM_SERVICE_NAME
              value: apm-demo-worker
            - name: ELASTIC_APM_ENVIRONMENT
              value: local
            - name: ELASTIC_APM_APPLICATION_PACKAGES
              value: io.systemlens.demo
            - name: ELASTIC_APM_TRANSACTION_IGNORE_URLS
              value: /jolokia/*
            - name: ELASTIC_APM_DISABLE_INSTRUMENTATIONS
              value: jdk-httpserver
            - name: ELASTIC_APM_SERVER_URL
              value: https://apm-server-apm-http.elastic-stack.svc:8200
            - name: ELASTIC_APM_VERIFY_SERVER_CERT
              value: "false"
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apm-server-apm-token
                  key: secret-token
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://192.168.33.10:27017,192.168.33.11:27017,192.168.33.12:27017/observability_test?replicaSet=poc-rs
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.33.10:9092,192.168.33.11:9092,192.168.33.12:9092
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo-worker
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo-worker
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo-worker-jolokia
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo-worker
  ports:
    - name: jolokia
      port: 8774
      targetPort: jmx-consumer
