otel.service.name=inventory-service
otel.service.version=1.0.0
otel.exporter.otlp.endpoint=http://otel-edge-vm.elastic-stack.svc.cluster.local:4318
otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
otel.metrics.exporter=none
# Logs Logback exportés en OTLP natif, corrélés aux traces (ADR-012). Les
# paires clé-valeur SLF4J (addKeyValue) deviennent des attributs du log ;
# experimental-log-attributes ajoute thread.name et thread.id.
otel.logs.exporter=otlp
otel.instrumentation.logback-appender.experimental.capture-key-value-pair-attributes=true
otel.instrumentation.logback-appender.experimental-log-attributes=true
otel.propagators=tracecontext,baggage
