# Raccordement à la chaîne d'observabilité (ADR-019) : l'opérateur
# OpenTelemetry injecte l'agent Java défini par le CR Instrumentation
# elastic-stack/otel-kube-stack (platform/helm/opentelemetry-kube-stack-values.yaml).
# L'agent et Micrometer exportent vers le collecteur daemon du nœud, qui pose
# les attributs k8s.* (k8sattributes) puis transmet à l'Edge ; aucune clé Edge
# ni attribut Kubernetes n'est déclaré dans le pod. service.version reste la
# version applicative et non le tag de l'image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: h0tl-supermarche-app
spec:
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: elastic-stack/otel-kube-stack
        resource.opentelemetry.io/service.version: "1.0.0"
    spec:
      containers:
        - name: order-service
          env:
            # Métriques métier Micrometer (metrics-<dataset>.otel-*), vers le
            # même collecteur daemon que l'agent.
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
              value: http://otel-kube-stack-daemon-collector.elastic-stack.svc.cluster.local:4318/v1/metrics
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_STEP
              value: 15s
            - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED
              value: "false"
---
