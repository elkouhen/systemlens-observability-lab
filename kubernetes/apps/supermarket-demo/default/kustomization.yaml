apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: h0tl-supermarche-app
resources:
  - ../base
images:
  - name: order-service
    newTag: 1.1.7
  - name: inventory-service
    newTag: 1.1.7
  - name: restock-service
    newTag: 1.1.7
patches:
  - path: data-endpoints.yaml
  - path: otel-instrumentation.yaml
  - path: logging.yaml
    target:
      kind: Deployment
