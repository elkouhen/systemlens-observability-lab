apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: h0tl-supermarche-app
spec:
  template:
    spec:
      initContainers:
        - name: opentelemetry-javaagent
          image: curlimages/curl:8.12.1
          command: ["sh", "-ec"]
          args:
            - curl --fail --silent --show-error --location
              --output /opt/opentelemetry-javaagent/opentelemetry-javaagent.jar
              https://repo1.maven.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/2.28.1/opentelemetry-javaagent-2.28.1.jar
          volumeMounts:
            - name: opentelemetry-javaagent
              mountPath: /opt/opentelemetry-javaagent
      containers:
        - name: order-service
          env:
            - name: OTEL_SERVICE_NAME
              value: order-service
            - name: OTEL_SERVICE_VERSION
              value: "1.0.0"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homologation,k8s.namespace.name=h0tl-supermarche-app
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-gateway.elastic-stack.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/opt/opentelemetry-javaagent/opentelemetry-javaagent.jar
          volumeMounts:
            - name: opentelemetry-javaagent
              mountPath: /opt/opentelemetry-javaagent
      volumes:
        - name: opentelemetry-javaagent
          emptyDir: {}
---
