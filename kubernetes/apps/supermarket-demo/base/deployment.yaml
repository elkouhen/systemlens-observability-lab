apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: h0tl-supermarche-app
spec:
  replicas: 1
  # Le cluster k3d du POC ne dispose que d'un nœud à 2 vCPU : remplacer le
  # pod plutôt que créer un surge évite un rollout bloqué. En production,
  # conserver le surge avec plusieurs replicas et une capacité réservée.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:1.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            - name: LOGGING_STRUCTURED_ECS_SERVICE_NAME
              value: order-service
            - name: LOGGING_STRUCTURED_ECS_SERVICE_VERSION
              value: "1.0.0"
            - name: LOGGING_STRUCTURED_ECS_SERVICE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ORDER_SERVICE_INVENTORY_SERVICE_URL
              value: http://inventory-service:3001
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.33.10:9092
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: restock-service
  namespace: h0tl-supermarche-app
spec:
  selector:
    app.kubernetes.io/name: restock-service
  ports:
    - name: http
      port: 3002
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: h0tl-supermarche-app
spec:
  selector:
