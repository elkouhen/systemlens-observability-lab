apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: h0tl-supermarche-app
spec:
  template:
    spec:
      containers:
        - name: order-service
          env:
            - name: ELASTIC_APM_ENABLED
              value: "false"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
              value: http://otel-gateway.elastic-stack.svc.cluster.local:4318/v1/metrics
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_STEP
              value: 15s
            - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -javaagent:/opt/opentelemetry-javaagent.jar
                -Dotel.javaagent.configuration-file=/opt/opentelemetry/otel.properties
          volumeMounts:
            - name: order-service-otel-config
              mountPath: /opt/opentelemetry
              readOnly: true
      volumes:
        - name: order-service-otel-config
          configMap:
            name: order-service-otel-config
---
