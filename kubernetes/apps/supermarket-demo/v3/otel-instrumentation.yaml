apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: h0tl-supermarche-app
spec:
  template:
    spec:
      initContainers:
        - $patch: delete
          name: apm-truststore
      containers:
        - name: order-service
          env:
            - $patch: delete
              name: ELASTIC_APM_SERVICE_NAME
            - $patch: delete
              name: ELASTIC_APM_SERVICE_VERSION
            - $patch: delete
              name: ELASTIC_APM_ENVIRONMENT
            - $patch: delete
              name: ELASTIC_APM_APPLICATION_PACKAGES
            - $patch: delete
              name: ELASTIC_APM_SERVER_URL
            - $patch: delete
              name: ELASTIC_APM_SECRET_TOKEN
            - $patch: delete
              name: ELASTIC_APM_ENABLE_LOG_CORRELATION
            - name: ELASTIC_APM_ENABLED
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: order-service
            - name: OTEL_SERVICE_VERSION
              value: "1.0.0"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homologation,k8s.namespace.name=h0tl-supermarche-app
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-gateway.elastic-stack.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
              value: http://otel-gateway.elastic-stack.svc.cluster.local:4318/v1/metrics
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_STEP
              value: 15s
            - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED
              value: "false"
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/opt/opentelemetry-javaagent.jar
          volumeMounts:
            - $patch: delete
              name: apm-server-ca
            - $patch: delete
              name: apm-truststore
      volumes:
        - $patch: delete
          name: apm-server-ca
        - $patch: delete
          name: apm-truststore
---
