apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: h0tl-supermarche-app
spec:
  template:
    spec:
      containers:
        - name: order-service
          env:
            - name: ELASTIC_APM_ENABLED
              value: "false"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
              value: http://otel-gateway.elastic-stack.svc.cluster.local:4318/v1/metrics
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_STEP
              value: 15s
            - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED
              value: "false"
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: K8S_POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homologation,k8s.namespace.name=h0tl-supermarche-app,k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID),k8s.node.name=$(K8S_NODE_NAME)
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -javaagent:/opt/opentelemetry-javaagent.jar
                -Dotel.javaagent.configuration-file=/opt/opentelemetry/otel.properties
          volumeMounts:
            - name: order-service-otel-config
              mountPath: /opt/opentelemetry
              readOnly: true
      volumes:
        - name: order-service-otel-config
          configMap:
            name: order-service-otel-config
---
