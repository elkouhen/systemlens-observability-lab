otel.service.name=inventory-service
otel.service.version=1.0.0
otel.resource.attributes=deployment.environment=homologation,k8s.namespace.name=h0tl-supermarche-app
otel.exporter.otlp.endpoint=http://otel-gateway.elastic-stack.svc.cluster.local:4318
otel.exporter.otlp.protocol=http/protobuf
