apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: h0tl-demo-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: demo-api:1.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3010
          # Sondes TCP : aucune transaction APM parasite.
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: h0tl-demo-app
spec:
  selector:
    app.kubernetes.io/name: demo-api
  ports:
    - name: http
      port: 3010
      targetPort: http
