apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: h0tl-demo-app
resources:
  - ../base
images:
  - name: demo-api
    newTag: 1.1.1
configMapGenerator:
  - name: demo-api-otel-config
    files:
      - otel.properties=otel/demo-api.properties
patches:
  - path: otel-instrumentation.yaml
