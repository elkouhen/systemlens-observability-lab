# Raccordement à la chaîne d'observabilité (ADR-019) : l'opérateur
# OpenTelemetry injecte l'agent Java défini par le CR Instrumentation
# elastic-stack/otel-kube-stack (platform/helm/opentelemetry-kube-stack-values.yaml).
# L'agent exporte vers le collecteur daemon du nœud, qui pose
# les attributs k8s.* (k8sattributes) puis transmet à l'Edge ; aucune clé Edge
# ni attribut Kubernetes n'est déclaré dans le pod. service.version reste la
# version applicative et non le tag de l'image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: h0tl-demo-app
spec:
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: elastic-stack/otel-kube-stack
        resource.opentelemetry.io/service.version: "1.1.0"
