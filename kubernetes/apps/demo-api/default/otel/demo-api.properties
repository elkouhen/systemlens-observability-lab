otel.service.name=demo-api
otel.service.version=1.1.0
otel.exporter.otlp.endpoint=http://otel-edge-vm.elastic-stack.svc.cluster.local:4317
otel.exporter.otlp.protocol=grpc
otel.traces.exporter=otlp
# Métriques de l'agent (sémantique OTel) : runtime JVM (jvm.memory.used,
# jvm.memory.limit, jvm.gc.duration, jvm.thread.count, jvm.class.count,
# jvm.cpu.recent_utilization...) lues par l'onglet Metrics de l'UI APM, et
# http.server.request.duration. Les métriques expérimentales ajoutent
# jvm.system.cpu.utilization et jvm.buffer.memory.used.
otel.metrics.exporter=otlp
otel.metric.export.interval=15000
otel.instrumentation.runtime-telemetry.emit-experimental-telemetry=true
# Logs Logback exportés en OTLP natif, corrélés aux traces (ADR-012).
otel.logs.exporter=otlp
otel.propagators=tracecontext,baggage
