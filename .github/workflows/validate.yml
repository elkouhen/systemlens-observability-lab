name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: azure/setup-kubectl@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install ansible-core==2.19.3
      - run: ansible-galaxy collection install -r v1/ansible/requirements.yml
      - run: make ci
