name: Publication du diagramme C4

on:
  push:
    branches: [main]
    paths:
      - 'architecture/docs/**'
      - 'architecture/Makefile'
      - '.github/workflows/publish-c4-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construire le site LikeC4
        run: make -C architecture c4-pages-build C4_PAGES_BASE='${{ steps.pages.outputs.base_path }}/'

      - name: Publier l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: architecture/dist/c4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
