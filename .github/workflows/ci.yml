name: Validate laboratory

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the laboratory
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ansible-core

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r architecture/ansible/requirements.yml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Run repository validation
        run: make ci
