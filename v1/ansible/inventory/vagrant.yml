---
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  children:
    poc_data:
      hosts:
        data-01:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_ssh_private_key_file: .vagrant/machines/data-01/virtualbox/private_key
        data-02:
          ansible_host: 127.0.0.1
          ansible_port: 2200
          ansible_ssh_private_key_file: .vagrant/machines/data-02/virtualbox/private_key
        data-03:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          ansible_ssh_private_key_file: .vagrant/machines/data-03/virtualbox/private_key
