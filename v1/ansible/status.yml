---
- name: Vérifier MongoDB, Kafka et PostgreSQL sur les VM du POC
  hosts: "{{ 'data-01' if (lookup('env', 'POC_PROFILE') | default('minimal', true)) == 'minimal' else 'poc_data' }}"
  become: true
  gather_facts: false

  vars:
    poc_profile: "{{ lookup('env', 'POC_PROFILE') | default('minimal', true) }}"
    poc_distributed: false

  tasks:
    - name: Vérifier les conteneurs POC
      ansible.builtin.command: podman ps --format '{{ "{{" }}.Names{{ "}}" }} {{ "{{" }}.Status{{ "}}" }}'
      register: podman_status
      changed_when: false
      failed_when: false

    - name: Afficher les conteneurs par VM
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — {{ podman_status.stdout_lines | default(['aucun conteneur']) }}"

    - name: Lire l'état du replica set MongoDB
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - poc-mongodb
          - mongosh
          - --quiet
          - --eval
          - "JSON.stringify(rs.status().members.map(member => ({name: member.name, state: member.stateStr, health: member.health})))"
      register: mongodb_replica_status
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: data-01
      when: poc_distributed | bool

    - name: Vérifier MongoDB standalone
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - poc-mongodb
          - mongosh
          - --quiet
          - --eval
          - "db.adminCommand({ping: 1}).ok"
      register: mongodb_standalone_status
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: data-01
      when: not (poc_distributed | bool)

    - name: Afficher l'état du replica set MongoDB
      ansible.builtin.debug:
        msg: "MongoDB replica set — {{ mongodb_replica_status.stdout | default('indisponible') }}"
      run_once: true
      when: poc_distributed | bool

    - name: Afficher l'état de MongoDB standalone
      ansible.builtin.debug:
        msg: "MongoDB standalone — {{ mongodb_standalone_status.stdout | default('indisponible') }}"
      run_once: true
      when: not (poc_distributed | bool)

    - name: Lire le quorum Kafka KRaft
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - poc-kafka
          - /opt/kafka/bin/kafka-metadata-quorum.sh
          - --bootstrap-server
          - localhost:9092
          - describe
          - --status
      register: kafka_quorum_status
      changed_when: false
      failed_when: false

    - name: Afficher le quorum Kafka par VM
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — {{ kafka_quorum_status.stdout | default('Kafka indisponible') }}"

    - name: Lire le décalage du consommateur de commandes Kafka
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - poc-kafka
          - /opt/kafka/bin/kafka-consumer-groups.sh
          - --bootstrap-server
          - localhost:9092
          - --describe
          - --group
          - inventory-service
      register: kafka_demo_consumer_status
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: data-01

    - name: Afficher le décalage du consommateur de commandes Kafka
      ansible.builtin.debug:
        msg: "Kafka inventory-service — {{ kafka_demo_consumer_status.stdout | default('groupe indisponible ou aucune consommation') }}"
      run_once: true

    - name: Compter les commandes en ligne persistées dans MongoDB
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - poc-mongodb
          - mongosh
          - --quiet
          - observability_test
          - --eval
          - "JSON.stringify({count: db.order_fulfillments.countDocuments({channel: 'kafka'}), latest: db.order_fulfillments.find({channel: 'kafka'}).sort({createdAt: -1}).limit(1).toArray()})"
      register: mongodb_demo_work_status
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: data-01

    - name: Afficher les commandes en ligne persistées dans MongoDB
      ansible.builtin.debug:
        msg: "MongoDB order_fulfillments — {{ mongodb_demo_work_status.stdout | default('indisponible') }}"
      run_once: true

    - name: Vérifier PostgreSQL sur data-01
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - poc-postgresql
          - pg_isready
          - -U
          - observability
          - -d
          - observability_test
      register: postgresql_status
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: data-01

    - name: Compter les commandes en ligne persistées dans PostgreSQL
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - poc-postgresql
          - psql
          - -U
          - observability
          - -d
          - observability_test
          - -tAc
          - "SELECT count(*) FROM stock_movements WHERE channel = 'kafka'"
      register: postgresql_demo_work_status
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: data-01

    - name: Afficher l'état et les traitements PostgreSQL
      ansible.builtin.debug:
        msg: "PostgreSQL data-01 — {{ postgresql_status.stdout | default('indisponible') }} ; commandes en ligne : {{ postgresql_demo_work_status.stdout | default('indisponible') }}"
      run_once: true
