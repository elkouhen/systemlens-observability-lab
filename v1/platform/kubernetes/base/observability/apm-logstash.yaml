apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-logstash-pipeline
  namespace: elastic-stack
data:
  apm.conf: |
    input {
      # Flux APM Server (protocole Lumberjack).
      elastic_agent {
        port => 5044
        enrich => none
      }
    }

    filter {
      # Pipeline APM réutilisable : le Java agent reçoit le namespace via la
      # Downward API et le transmet à APM Server.
      if [kubernetes][namespace] =~ /^[rphid][A-Za-z0-9]{3}-.+$/ {
        grok {
          match => {
            "[kubernetes][namespace]" => "^(?<environment_type>[rphid])(?<platform_code>[A-Za-z0-9]{3})-(?<application_namespace>.+)$"
          }
        }

        # Le dictionnaire centralise la correspondance entre le code du contrat
        # applicatif et le nom d'environnement Elastic attendu.
        translate {
          source => "environment_type"
          target => "[@metadata][environment]"
          dictionary => {
            "r" => "recette"
            "p" => "production"
            "h" => "homologation"
            "i" => "integration"
            "d" => "developpement"
          }
          fallback => ""
        }

        if [@metadata][environment] {
          mutate {
            add_field => {
              "[labels][ptf]" => "%{platform_code}"
              "[labels][namespace]" => "%{application_namespace}"
            }
          }

          # Une valeur explicitement fournie par l'agent Java est prioritaire.
          # Le namespace Kubernetes ne sert que de valeur de secours.
          if ![service][environment] or [service][environment] == "" {
            mutate {
              replace => {
                "[service][environment]" => "%{[@metadata][environment]}"
              }
            }
          }

          # Les signaux APM Java sont routés depuis le namespace Kubernetes.
          if [agent][name] == "java" and [data_stream][type] == "traces" {
            mutate {
              replace => {
                # Le dataset porte l'identité de la plateforme ; le namespace
                # sépare l'environnement sans perdre cette information.
                "[data_stream][dataset]" => "apm-%{platform_code}"
                "[data_stream][namespace]" => "%{[@metadata][environment]}"
              }
            }
          }

          # Seules les métriques APM applicatives détaillées sont reroutées ;
          # les métriques internes APM restent gérées par les templates Elastic.
          if [agent][name] == "java" and
             [data_stream][type] == "metrics" and
             [data_stream][dataset] =~ /^apm\.app\./ {
            mutate {
              replace => {
                "[data_stream][dataset]" => "apm-%{platform_code}"
                "[data_stream][namespace]" => "%{[@metadata][environment]}"
              }
            }
          }
        }

        mutate {
          remove_field => ["environment_type", "platform_code", "application_namespace"]
        }
      }

      # APM Server peut perdre processor.event lors du passage par l'entrée
      # Logstash. Le nom de span distingue un span ; sinon le nom de transaction
      # identifie l'événement racine utilisé par la waterfall Kibana.
      if [data_stream][type] == "traces" and [span][name] and [span][name] != "" {
        mutate {
          replace => { "[processor][event]" => "span" }
        }
      } else if [data_stream][type] == "traces" and [transaction][name] {
        mutate {
          replace => { "[processor][event]" => "transaction" }
        }
      }

      # Les traces et métriques applicatives partagent le dataset de la
      # plateforme ; le namespace sépare les environnements.
    }

    output {
      # Les événements restent ECS. Les règles ci-dessus ne modifient que le
      # data stream des logs et métriques applicatives concernés.
      elasticsearch {
        hosts => ["https://elasticsearch-es-http.elastic-stack.svc:9200"]
        api_key => "${ELASTICSEARCH_API_KEY}"
        data_stream => true
        data_stream_auto_routing => true
        ecs_compatibility => "v8"
        ssl_certificate_authorities => "/usr/share/logstash/config/elasticsearch-ca/ca.crt"
      }
    }
  kubernetes-logs.conf: |
    input {
      # Flux des Elastic Agents Kubernetes (protocole Beats/Logstash).
      beats {
        port => 5045
      }
    }

    filter {
      # Metricbeat v1 n'installe pas les assets Kibana et ne renseigne pas
      # systématiquement les champs data_stream.*. Le type et le dataset ECS
      # sont donc reconstruits avant le routage automatique vers metrics-*.
      if [agent][type] == "metricbeat" and [event][dataset] {
        mutate {
          replace => {
            "[data_stream][type]" => "metrics"
            "[data_stream][dataset]" => "%{[event][dataset]}"
          }
        }
      }

      # Pipeline spécifique au POC Kubernetes : l'identité vient du namespace.
      if [data_stream][type] == "logs" and [data_stream][dataset] == "kubernetes.container_logs" and [kubernetes][namespace] =~ /^[rphid][A-Za-z0-9]{3}-.+$/ {
        grok {
          match => {
            "[kubernetes][namespace]" => "^(?<environment_type>[rphid])(?<platform_code>[A-Za-z0-9]{3})-(?<application_namespace>.+)$"
          }
        }

        translate {
          source => "environment_type"
          target => "[@metadata][environment]"
          dictionary => {
            "r" => "recette"
            "p" => "production"
            "h" => "homologation"
            "i" => "integration"
            "d" => "developpement"
          }
          fallback => ""
        }

        if [@metadata][environment] {
          mutate {
            add_field => {
              "[labels][ptf]" => "%{platform_code}"
              "[labels][namespace]" => "%{application_namespace}"
            }
            replace => {
              "[service][environment]" => "%{[@metadata][environment]}"
              "[data_stream][dataset]" => "kube-%{platform_code}"
              "[data_stream][namespace]" => "%{[@metadata][environment]}"
            }
          }
        }

        # Nettoyage systématique, y compris si la traduction échoue, pour
        # éviter que les champs bruts ne fuient dans le document indexé.
        mutate {
          remove_field => ["environment_type", "platform_code", "application_namespace"]
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["https://elasticsearch-es-http.elastic-stack.svc:9200"]
        api_key => "${ELASTICSEARCH_API_KEY}"
        data_stream => true
        data_stream_auto_routing => true
        ecs_compatibility => "v8"
        ssl_certificate_authorities => "/usr/share/logstash/config/elasticsearch-ca/ca.crt"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-logstash-settings
  namespace: elastic-stack
data:
  logstash.yml: |
    api.http.host: 0.0.0.0
    pipeline.ecs_compatibility: v8
    config.reload.automatic: true
    config.reload.interval: 3s
  pipelines.yml: |
    - pipeline.id: apm
      path.config: "/usr/share/logstash/pipeline/apm.conf"
    - pipeline.id: kubernetes-logs
      path.config: "/usr/share/logstash/pipeline/kubernetes-logs.conf"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-logstash
  namespace: elastic-stack
  labels:
    app.kubernetes.io/name: apm-logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.3
          ports:
            - name: apm-lumberjack
              containerPort: 5044
            - name: agent-beats
              containerPort: 5045
          env:
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apm-logstash-elasticsearch
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
            - name: settings
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: settings
              mountPath: /usr/share/logstash/config/pipelines.yml
              subPath: pipelines.yml
              readOnly: true
            - name: elasticsearch-ca
              mountPath: /usr/share/logstash/config/elasticsearch-ca
              readOnly: true
      volumes:
        - name: pipeline
          configMap:
            name: apm-logstash-pipeline
        - name: settings
          configMap:
            name: apm-logstash-settings
        - name: elasticsearch-ca
          secret:
            secretName: elasticsearch-es-http-certs-public
---
apiVersion: v1
kind: Service
metadata:
  name: apm-logstash
  namespace: elastic-stack
  labels:
    app.kubernetes.io/name: apm-logstash
spec:
  selector:
    app.kubernetes.io/name: apm-logstash
  ports:
    - name: apm-lumberjack
      port: 5044
      targetPort: apm-lumberjack
    - name: agent-beats
      port: 5045
      targetPort: agent-beats
