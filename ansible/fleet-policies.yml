---
# Migration optionnelle vers la policy commune déclarée par Kubernetes :
# KIBANA_PASSWORD='…' ansible-playbook ansible/fleet-policies.yml
- name: Réaffecter les agents du POC à la policy Fleet commune
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # L'Ingress Traefik local est publié sur 127.0.0.1. L'en-tête Host permet
    # de sélectionner la route Kibana sans dépendre du DNS de l'hôte.
    kibana_url: "{{ lookup('env', 'KIBANA_URL') | default('https://127.0.0.1', true) }}"
    kibana_host: "{{ lookup('env', 'KIBANA_HOST') | default('kibana.poc.test', true) }}"
    kibana_username: "{{ lookup('env', 'KIBANA_USERNAME') | default('elastic', true) }}"
    kibana_password: "{{ lookup('env', 'KIBANA_PASSWORD') }}"
    fleet_policy_id: mongodb-hosts
    fleet_nodes: [data-01, data-02, data-03]

  module_defaults:
    ansible.builtin.uri:
      validate_certs: false
      user: "{{ kibana_username }}"
      password: "{{ kibana_password }}"
      force_basic_auth: true
      headers:
        Host: "{{ kibana_host }}"
        kbn-xsrf: 'true'
        Content-Type: application/json

  pre_tasks:
    - name: Vérifier le mot de passe Kibana
      ansible.builtin.assert:
        that: kibana_password | length > 0
        fail_msg: Définir KIBANA_PASSWORD avant d’exécuter ce playbook.
      no_log: true

  tasks:
    - name: Lire les policies Fleet déclarées dans Kibana
      ansible.builtin.uri:
        url: "{{ kibana_url }}/api/fleet/agent_policies?perPage=100"
        method: GET
      register: fleet_policies

    - name: Vérifier la policy commune déclarée par Kubernetes
      ansible.builtin.assert:
        that: >-
          fleet_policies.json['items']
          | selectattr('id', 'equalto', fleet_policy_id)
          | list | length == 1
        fail_msg: >-
          La policy {{ fleet_policy_id }} est absente. Appliquer d'abord
          platform/kubernetes/overlays/local via Kubernetes.

    - name: Lire les agents Fleet
      ansible.builtin.uri:
        url: "{{ kibana_url }}/api/fleet/agents?perPage=100"
        method: GET
      register: fleet_agents

    - name: Réaffecter les agents actifs à la policy commune
      ansible.builtin.uri:
        url: "{{ kibana_url }}/api/fleet/agents/{{ agent.id }}/reassign"
        method: POST
        body_format: json
        body:
          policy_id: "{{ fleet_policy_id }}"
      vars:
        agent: >-
          {{
            fleet_agents.json['items']
            | selectattr('local_metadata.host.hostname', 'equalto', item)
            | selectattr('active', 'equalto', true)
            | rejectattr('status', 'equalto', 'offline')
            | list | first | default({})
          }}
      loop: "{{ fleet_nodes }}"
      when: agent.id is defined and agent.policy_id != fleet_policy_id
