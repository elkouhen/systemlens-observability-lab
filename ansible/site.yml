---
- name: Provisionner les nœuds de données du POC
  hosts: all
  become: true
  gather_facts: true

  vars:
    poc_nodes:
      - { id: 1, name: data-01, ip: 192.168.33.10 }
      - { id: 2, name: data-02, ip: 192.168.33.11 }
      - { id: 3, name: data-03, ip: 192.168.33.12 }
    mongodb_replica_set: poc-rs
    mongodb_primary_ip: 192.168.33.10
    postgresql_host: 192.168.33.10
    postgresql_database: observability_test
    postgresql_user: observability
    # Identifiants de démonstration uniquement. En production, les fournir via
    # Ansible Vault ou un gestionnaire de secrets.
    postgresql_password: poc-postgresql-password
    kafka_cluster_id: q1Sh-9_ISia_zwGINzRvyQ
    kafka_controller_voters: 1@192.168.33.10:9093,2@192.168.33.11:9093,3@192.168.33.12:9093
    beats_version: 9.5.1
    elastic_agent_version: 9.5.1
    # Les VM accèdent à Elasticsearch via l'Ingress Traefik, pas via le port
    # HTTP interne du service Kubernetes.
    elasticsearch_url: https://elasticsearch.poc.test:443
    fleet_url: https://fleet.poc.test
    fleet_insecure: true
    poc_redeploy_services: false

  pre_tasks:
    - name: Vérifier les variables injectées par Vagrant
      ansible.builtin.assert:
        that:
          - poc_node_id is defined
          - poc_node_ip is defined
        fail_msg: Vagrant doit fournir poc_node_id et poc_node_ip au playbook.

    - name: Inventorier les paquets déjà installés
      ansible.builtin.package_facts:
        manager: auto

    - name: Installer les dépendances système absentes
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop: [podman, curl, openssl, chrony]
      when: item not in ansible_facts.packages

    - name: Collecter l'état des services
      ansible.builtin.service_facts:

    - name: Activer la synchronisation NTP des VM
      ansible.builtin.systemd_service:
        name: chronyd
        enabled: true
        state: started

    - name: Autoriser Chrony à corriger immédiatement les grands décalages
      ansible.builtin.lineinfile:
        path: /etc/chrony.conf
        regexp: '^makestep\\s+'
        line: 'makestep 1.0 -1'
      register: chrony_makestep_config

    - name: Redémarrer Chrony après une modification de sa stratégie de correction
      ansible.builtin.systemd_service:
        name: chronyd
        state: restarted
      when: chrony_makestep_config.changed

    - name: Corriger immédiatement un éventuel décalage d'horloge
      ansible.builtin.command: chronyc -a makestep
      register: chrony_step
      # chronyc retourne 0 même si aucun ajustement n'est nécessaire. L'agent
      # se recale seul avec Fleet ; ne pas provoquer de redémarrage à chaque
      # provisionnement.
      changed_when: false
      failed_when: false

    - name: Identifier l'interface du réseau privé VirtualBox
      ansible.builtin.shell: |
        ip -o -4 addr show | awk -v ip='{{ poc_node_ip }}' '$4 ~ ("^" ip "/") { print $2; exit }'
      args:
        executable: /bin/bash
      register: private_network_device
      changed_when: false

    - name: Vérifier l'interface du réseau privé
      ansible.builtin.assert:
        that: private_network_device.stdout | length > 0
        fail_msg: "Interface portant {{ poc_node_ip }} introuvable."

    - name: Lire le profil NetworkManager du réseau privé
      ansible.builtin.command: "nmcli -g GENERAL.CONNECTION device show {{ private_network_device.stdout }}"
      register: private_network_connection
      changed_when: false

    - name: Empêcher le réseau privé de devenir la route par défaut
      ansible.builtin.command: "nmcli connection modify {{ private_network_connection.stdout }} ipv4.never-default yes"
      changed_when: false

    - name: Réactiver le profil du réseau privé
      ansible.builtin.command: "nmcli connection up {{ private_network_connection.stdout }} ifname {{ private_network_device.stdout }}"
      changed_when: false

    - name: Identifier l'interface qui porte la route par défaut
      ansible.builtin.shell: "ip route show default | awk 'NR == 1 { print $5 }'"
      args:
        executable: /bin/bash
      register: default_network_device
      changed_when: false

    - name: Lire le profil NetworkManager de la route par défaut
      ansible.builtin.command: "nmcli -g GENERAL.CONNECTION device show {{ default_network_device.stdout }}"
      register: default_network_connection
      changed_when: false

    # Certaines images Vagrant reçoivent un serveur DNS DHCP invalide. La VM
    # doit pouvoir récupérer les images Podman et les artefacts Elastic lors du
    # premier provisionnement.
    - name: Configurer des résolveurs DNS fiables sur la route par défaut
      ansible.builtin.command: >-
        nmcli connection modify "{{ default_network_connection.stdout }}"
        ipv4.ignore-auto-dns yes ipv4.dns "1.1.1.1,8.8.8.8"
      changed_when: false

    - name: Appliquer la configuration DNS de la route par défaut
      ansible.builtin.command: "nmcli device reapply {{ default_network_device.stdout }}"
      changed_when: false

    - name: Ouvrir les ports inter-nœuds si firewalld est actif
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ [27017, 9092, 9093] + ([5432] if inventory_hostname == 'data-01' else []) }}"
      when: ansible_facts.services['firewalld.service'].state | default('stopped') == 'running'

    - name: Installer la résolution POC dans /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: '# {mark} POC ELASTIC HOSTS'
        block: |
          192.168.33.1 kibana.poc.test elasticsearch.poc.test fleet.poc.test apm.poc.test

    - name: Lire le certificat TLS public Elasticsearch du POC
      ansible.builtin.shell: |
        openssl s_client -showcerts -connect elasticsearch.poc.test:443 \
          -servername elasticsearch.poc.test </dev/null 2>/dev/null |
        awk '/BEGIN CERTIFICATE/{found=1} found {print} /END CERTIFICATE/{exit}'
      args:
        executable: /bin/bash
      register: elasticsearch_public_certificate
      changed_when: false

    - name: Vérifier le certificat public Elasticsearch
      ansible.builtin.assert:
        that: "'BEGIN CERTIFICATE' in elasticsearch_public_certificate.stdout"
        fail_msg: Le certificat TLS de elasticsearch.poc.test est inaccessible.

    - name: Installer le certificat public dans le magasin de confiance système
      ansible.builtin.copy:
        content: "{{ elasticsearch_public_certificate.stdout }}\n"
        dest: /etc/pki/ca-trust/source/anchors/poc-elasticsearch.crt
        mode: '0644'
      register: elasticsearch_ca

    - name: Mettre à jour le magasin de confiance système
      ansible.builtin.command: update-ca-trust extract
      when: elasticsearch_ca.changed
      changed_when: true

  tasks:
    - name: Créer les répertoires de logs
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: /var/log/mongodb, mode: '0755' }
        - { path: /var/log/kafka, mode: '0777' }
        - { path: /var/log/postgresql, mode: '0777' }
      when: inventory_hostname == 'data-01' or item.path != '/var/log/postgresql'

    - name: Créer le fichier de log MongoDB accessible au conteneur
      ansible.builtin.file:
        path: /var/log/mongodb/mongod.log
        state: touch
        mode: '0666'
        modification_time: preserve
        access_time: preserve

    - name: Créer le répertoire Jolokia
      ansible.builtin.file:
        path: /opt/poc-observability
        state: directory
        mode: '0755'

    - name: Créer le cache persistant des artefacts du POC
      ansible.builtin.file:
        path: /var/cache/poc-observability
        state: directory
        mode: '0755'

    - name: Vérifier la présence de l'agent Jolokia
      ansible.builtin.stat:
        path: /opt/poc-observability/jolokia-agent.jar
      register: jolokia_agent

    - name: Télécharger l'agent Jolokia pour Kafka s'il est absent
      ansible.builtin.get_url:
        url: https://repo1.maven.org/maven2/org/jolokia/jolokia-agent-jvm/2.2.0/jolokia-agent-jvm-2.2.0-javaagent.jar
        dest: /opt/poc-observability/jolokia-agent.jar
        mode: '0644'
      when: not jolokia_agent.stat.exists

    - name: Déployer les unités Quadlet MongoDB et Kafka
      ansible.builtin.template:
        src: "{{ item }}.container.j2"
        dest: "/etc/containers/systemd/{{ item }}.container"
        mode: '0644'
      loop: [poc-mongodb, poc-kafka]
      register: quadlet_units

    - name: Déployer l'unité Quadlet PostgreSQL sur data-01
      ansible.builtin.template:
        src: poc-postgresql.container.j2
        dest: /etc/containers/systemd/poc-postgresql.container
        mode: '0644'
      register: postgresql_quadlet_unit
      when: inventory_hostname == 'data-01'

    - name: Recharger systemd après les changements Quadlet
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: quadlet_units.changed or (postgresql_quadlet_unit.changed | default(false))

    - name: Démarrer MongoDB et Kafka
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        enabled: true
        state: started
      loop: [poc-mongodb, poc-kafka]

    - name: Démarrer PostgreSQL sur data-01
      ansible.builtin.systemd_service:
        name: poc-postgresql.service
        enabled: true
        state: started
      when: inventory_hostname == 'data-01'

    - name: Redéployer MongoDB et Kafka après un changement ou sur demande
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: restarted
      loop: [poc-mongodb, poc-kafka]
      when: quadlet_units.changed or (poc_redeploy_services | bool)

    - name: Redéployer PostgreSQL après un changement ou sur demande
      ansible.builtin.systemd_service:
        name: poc-postgresql.service
        state: restarted
      when: inventory_hostname == 'data-01' and (postgresql_quadlet_unit.changed | default(false) or (poc_redeploy_services | bool))

    - name: Attendre PostgreSQL sur data-01
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - poc-postgresql
          - pg_isready
          - -U
          - "{{ postgresql_user }}"
          - -d
          - "{{ postgresql_database }}"
      register: postgresql_ready
      retries: 15
      delay: 2
      until: postgresql_ready.rc == 0
      changed_when: false
      when: inventory_hostname == 'data-01'

    - name: Attendre que le broker Kafka local accepte les requêtes d'administration
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - poc-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --list
      register: kafka_ready
      retries: 30
      delay: 2
      until: kafka_ready.rc == 0
      changed_when: false

    - name: Créer le topic de travail de la démonstration Kafka
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - poc-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --create
          - --if-not-exists
          - --topic
          - apm-demo.work.requested
          - --partitions
          - '3'
          - --replication-factor
          - '3'
          - --config
          - min.insync.replicas=2
      register: kafka_demo_topic
      changed_when: "'Created topic' in kafka_demo_topic.stdout"
      run_once: true
      delegate_to: data-01

    - name: Lire le nombre de partitions du topic de démonstration
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - poc-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --describe
          - --topic
          - apm-demo.work.requested
      register: kafka_demo_topic_description
      changed_when: false
      run_once: true
      delegate_to: data-01

    - name: Augmenter le topic de démonstration à trois partitions si nécessaire
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - -e
          - KAFKA_OPTS=
          - poc-kafka
          - /opt/kafka/bin/kafka-topics.sh
          - --bootstrap-server
          - localhost:9092
          - --alter
          - --topic
          - apm-demo.work.requested
          - --partitions
          - '3'
      when: "'PartitionCount: 1' in kafka_demo_topic_description.stdout or 'PartitionCount: 2' in kafka_demo_topic_description.stdout"
      run_once: true
      delegate_to: data-01

    - name: Attendre MongoDB local
      # `retries` ne protège pas contre un mongosh bloqué : borner chaque
      # tentative permet à Ansible de continuer les contrôles et d'échouer
      # explicitement après le délai global plutôt que de rester suspendu.
      ansible.builtin.command: >-
        timeout 15 podman exec poc-mongodb mongosh --quiet
        'mongodb://127.0.0.1:27017/?directConnection=true'
        --eval 'db.adminCommand({ping: 1}).ok'
      register: mongodb_ping
      retries: 30
      delay: 2
      until: mongodb_ping.stdout | trim == '1'
      changed_when: false

    - name: Initialiser le replica set sur le premier nœud
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - poc-mongodb
          - mongosh
          - --quiet
          - --eval
          - "try { rs.status(); print('already-initialized') } catch (_) { rs.initiate({_id: '{{ mongodb_replica_set }}', members: [{_id: 0, host: '{{ mongodb_primary_ip }}:27017'}]}); print('initialized') }"
      register: mongodb_init
      changed_when: mongodb_init.stdout | trim == 'initialized'
      when: poc_node_id | int == 1

    - name: Ajouter ce nœud au replica set
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - poc-mongodb
          - mongosh
          - --quiet
          - --host
          - "{{ mongodb_primary_ip }}:27017"
          - --eval
          - "const cfg = rs.conf(); if (!cfg.members.some(member => member.host === '{{ poc_node_ip }}:27017')) { rs.add({host: '{{ poc_node_ip }}:27017'}); print('added') } else { print('already-member') }"
      register: mongodb_member
      retries: 30
      delay: 2
      until: mongodb_member.rc == 0
      changed_when: "'added' in mongodb_member.stdout"
      when: poc_node_id | int > 1

    - name: Vérifier la clé API Elasticsearch des Beats
      ansible.builtin.assert:
        that: elasticsearch_api_key | default('') | length > 0
        fail_msg: Définir ELASTICSEARCH_API_KEY avant de provisionner les VM.

    - name: Installer et configurer Filebeat et Metricbeat
      block:
        - name: Déterminer l'architecture des Beats
          ansible.builtin.set_fact:
            beats_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'x86_64' }}"

        - name: Vérifier les binaires Beats déjà installés
          ansible.builtin.stat:
            path: "/opt/poc-observability/{{ item }}-{{ beats_version }}-linux-{{ beats_arch }}/{{ item }}"
          loop: [filebeat, metricbeat]
          register: beats_binaries

        - name: Télécharger les archives des Beats absents
          ansible.builtin.get_url:
            url: "https://artifacts.elastic.co/downloads/beats/{{ item.item }}/{{ item.item }}-{{ beats_version }}-linux-{{ beats_arch }}.tar.gz"
            dest: "/var/cache/poc-observability/{{ item.item }}-{{ beats_version }}-linux-{{ beats_arch }}.tar.gz"
            mode: '0644'
          loop: "{{ beats_binaries.results }}"
          when: not item.stat.exists

        - name: Extraire Filebeat et Metricbeat
          ansible.builtin.unarchive:
            src: "/var/cache/poc-observability/{{ item }}-{{ beats_version }}-linux-{{ beats_arch }}.tar.gz"
            dest: /opt/poc-observability
            remote_src: true
            creates: "/opt/poc-observability/{{ item }}-{{ beats_version }}-linux-{{ beats_arch }}/{{ item }}"
          loop: [filebeat, metricbeat]

        - name: Créer les répertoires de configuration des Beats
          ansible.builtin.file:
            path: "/etc/{{ item }}"
            state: directory
            mode: '0750'
          loop: [filebeat, metricbeat]

        - name: Déployer la configuration des Beats
          ansible.builtin.template:
            src: "{{ item }}.yml.j2"
            dest: "/etc/{{ item }}/{{ item }}.yml"
            mode: '0600'
          loop: [filebeat, metricbeat]
          no_log: true

        - name: Installer les services systemd des Beats
          ansible.builtin.template:
            src: beat.service.j2
            dest: "/etc/systemd/system/{{ item }}.service"
            mode: '0644'
          loop: [filebeat, metricbeat]

        - name: Recharger systemd après l'installation des Beats
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Redémarrer Filebeat et Metricbeat après mise à jour de leur configuration
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: restarted
          loop: [filebeat, metricbeat]

    # Fleet demeure utilisé uniquement pour les intégrations MongoDB et Kafka.
    # Les entrées System et les fichiers de logs y sont explicitement désactivés.
    - name: Installer Elastic Agent pour les intégrations MongoDB et Kafka
      when: fleet_enrollment_token | default('') | length > 0
      block:
        - name: Déterminer l'architecture Elastic Agent
          ansible.builtin.set_fact:
            elastic_agent_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'x86_64' }}"

        - name: Vérifier le binaire Elastic Agent déjà installé
          ansible.builtin.stat:
            path: /opt/Elastic/Agent/elastic-agent
          register: elastic_agent_binary

        - name: Télécharger Elastic Agent s'il est absent
          ansible.builtin.get_url:
            url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
            dest: "/var/cache/poc-observability/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
            mode: '0644'
          when: not elastic_agent_binary.stat.exists

        - name: Extraire Elastic Agent
          ansible.builtin.unarchive:
            src: "/var/cache/poc-observability/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}.tar.gz"
            dest: /var/cache/poc-observability
            remote_src: true
            creates: "/var/cache/poc-observability/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}/elastic-agent"
          when: not elastic_agent_binary.stat.exists

        - name: Installer et enrôler Elastic Agent
          ansible.builtin.command: >-
            /var/cache/poc-observability/elastic-agent-{{ elastic_agent_version }}-linux-{{ elastic_agent_arch }}/elastic-agent
            install --non-interactive --url={{ fleet_url }}
            --enrollment-token={{ fleet_enrollment_token }}
            {{ '--insecure' if fleet_insecure | bool else '' }}
          args:
            creates: /opt/Elastic/Agent/elastic-agent
          no_log: true

        - name: Démarrer Elastic Agent
          ansible.builtin.systemd_service:
            name: elastic-agent
            enabled: true
            state: started
