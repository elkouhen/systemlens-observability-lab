---
- name: Construire le marqueur de validation
  ansible.builtin.set_fact:
    validation_marker: "otel-validation-{{ validation_path_name }}-{{ inventory_hostname }}-{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

- name: Vérifier les paramètres indispensables
  ansible.builtin.assert:
    that:
      - otel_endpoint is defined
      - elasticsearch_url is defined
      - kibana_url is defined
      - elasticsearch_password | length > 0
    fail_msg: >-
      Renseigner les URL dans l'inventaire et exporter ELASTICSEARCH_PASSWORD
      avant d'exécuter ce playbook.
  no_log: true

- name: Vérifier que Kibana est joignable
  ansible.builtin.uri:
    url: "{{ kibana_url }}/api/status"
    method: GET
    user: "{{ elasticsearch_username }}"
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_certs }}"
    status_code: 200
  no_log: true

- name: Envoyer un log de validation au receiver OTLP HTTP
  ansible.builtin.uri:
    url: "{{ otel_endpoint | regex_replace('/$', '') }}/v1/logs"
    method: POST
    body_format: json
    headers:
      Content-Type: application/json
    body:
      resourceLogs:
        - resource:
            attributes:
              - key: service.name
                value:
                  stringValue: "{{ otel_service_name }}"
              - key: deployment.environment.name
                value:
                  stringValue: "{{ otel_deployment_environment }}"
          scopeLogs:
            - scope:
                name: validation.ansible
              logRecords:
                - severityText: INFO
                  body:
                    stringValue: "{{ validation_marker }}"
                  attributes:
                    - key: validation.marker
                      value:
                        stringValue: "{{ validation_marker }}"
    status_code: [200, 202]

- name: Attendre l'indexation du message dans Elasticsearch exploité par Kibana
  ansible.builtin.uri:
    url: "{{ elasticsearch_url | regex_replace('/$', '') }}/{{ validation_index_pattern }}/_search"
    method: POST
    user: "{{ elasticsearch_username }}"
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    validate_certs: "{{ elasticsearch_validate_certs }}"
    body_format: json
    body:
      size: 1
      query:
        query_string:
          query: '"{{ validation_marker }}"'
      sort:
        - '@timestamp': desc
    status_code: 200
  register: indexed_message
  until: (indexed_message.json.hits.total.value | int) > 0
  retries: "{{ (validation_timeout_seconds | int / validation_poll_delay_seconds | int) | round(0, 'ceil') | int }}"
  delay: "{{ validation_poll_delay_seconds }}"
  no_log: true

- name: Afficher le résultat de la validation
  ansible.builtin.debug:
    msg: >-
      Parcours {{ validation_path_name }} validé : {{ validation_marker }}.
      Il est consultable dans Kibana Discover avec la recherche exacte
      "{{ validation_marker }}" sur le data view couvrant {{ validation_index_pattern }}.
