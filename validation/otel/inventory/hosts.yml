---
# Inventaire d'exemple : adapter les URL à l'environnement à valider.
all:
  children:
    otel_validation:
      children:
        otel_validation_edge:
          hosts:
            otel-edge-01:
              ansible_host: 127.0.0.1
              # Le port SSH est généré par Vagrant ; `make otel-validation`
              # remplace cette valeur avant l'exécution.
              ansible_port: 22
              ansible_user: vagrant
              ansible_ssh_private_key_file: "{{ inventory_dir }}/../../../architecture/.vagrant/machines/otel-edge-01/virtualbox/private_key"
              ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        otel_validation_haproxy:
          hosts:
            localhost:
      vars:
        # Collecteur Edge : exécution SSH dans la VM, via HAProxy.
        otel_gateway_direct_endpoint: http://127.0.0.1:4318
        # HAProxy : appel direct depuis le contrôleur Ansible vers IP:port VM.
        otel_haproxy_direct_endpoint: http://192.168.33.10:4318
        otel_service_name: otel-validation
        otel_deployment_environment: homologation

        # Elasticsearch porte les données affichées dans Kibana Discover.
        kibana_url: http://kibana.observability.test:5601
        elasticsearch_url: http://elasticsearch.observability.test:9200
        elasticsearch_username: elastic
        elasticsearch_password: "{{ lookup('ansible.builtin.env', 'ELASTICSEARCH_PASSWORD') }}"
        elasticsearch_validate_certs: true

        validation_index_pattern: logs-*
        validation_timeout_seconds: 90
        validation_poll_delay_seconds: 3
