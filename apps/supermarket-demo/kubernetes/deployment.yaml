          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: apm-server-ca
              mountPath: /var/run/secrets/apm-server
              readOnly: true
            - name: apm-truststore
              mountPath: /opt/elastic-apm/truststore
              readOnly: true
      initContainers:
        - name: apm-truststore
          image: inventory-service:1.0.7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              cp "$JAVA_HOME/lib/security/cacerts" /opt/elastic-apm/truststore/cacerts &&
              keytool -importcert -noprompt -trustcacerts -alias apm-server-ca
              -file /var/run/secrets/apm-server/ca.crt
              -keystore /opt/elastic-apm/truststore/cacerts -storepass changeit
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: apm-server-ca
              mountPath: /var/run/secrets/apm-server
              readOnly: true
            - name: apm-truststore
              mountPath: /opt/elastic-apm/truststore
      volumes:
        - name: apm-server-ca
          secret:
            secretName: order-service-apm-server-ca
        - name: apm-truststore
          emptyDir: {}
