apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: supermarket-demo
spec:
  replicas: 1
  # Le cluster k3d du POC ne dispose que d'un nœud à 2 vCPU : remplacer le
  # pod plutôt que créer un surge évite un rollout bloqué. En production,
  # conserver le surge avec plusieurs replicas et une capacité réservée.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:1.0.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            - name: LOGGING_STRUCTURED_ECS_SERVICE_NAME
              value: order-service
            - name: LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT
              value: elastic-dev
            - name: LOGGING_STRUCTURED_ECS_SERVICE_VERSION
              value: "1.0.0"
            - name: LOGGING_STRUCTURED_ECS_SERVICE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ELASTIC_APM_SERVICE_NAME
              value: order-service
            - name: ELASTIC_APM_SERVICE_VERSION
              value: "1.0.0"
            - name: ELASTIC_APM_ENVIRONMENT
              value: elastic-dev
            - name: DEPLOYMENT_ENVIRONMENT
              value: elastic-dev
            - name: ELASTIC_APM_APPLICATION_PACKAGES
              value: io.systemlens.supermarket.order
            - name: ELASTIC_APM_SERVER_URL
              value: https://apm-server-apm-http.elastic-stack.svc:8200
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: order-service-apm-token
                  key: secret-token
            # L'agent Elastic ajoute trace.id/span.id au MDC Logback ; l'encodeur
            # ECS les conserve pour la navigation log-trace.
            - name: ELASTIC_APM_ENABLE_LOG_CORRELATION
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: -Djavax.net.ssl.trustStore=/opt/elastic-apm/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit
            - name: ORDER_SERVICE_INVENTORY_SERVICE_URL
              value: http://inventory-service:3001
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.33.10:9092,192.168.33.11:9092,192.168.33.12:9092
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: apm-server-ca
              mountPath: /var/run/secrets/apm-server
              readOnly: true
            - name: apm-truststore
              mountPath: /opt/elastic-apm/truststore
              readOnly: true
      initContainers:
        - name: apm-truststore
          image: order-service:1.0.7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              cp "$JAVA_HOME/lib/security/cacerts" /opt/elastic-apm/truststore/cacerts &&
              keytool -importcert -noprompt -trustcacerts -alias apm-server-ca
              -file /var/run/secrets/apm-server/ca.crt
              -keystore /opt/elastic-apm/truststore/cacerts -storepass changeit
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: apm-server-ca
              mountPath: /var/run/secrets/apm-server
              readOnly: true
            - name: apm-truststore
              mountPath: /opt/elastic-apm/truststore
      volumes:
        - name: apm-server-ca
          secret:
            secretName: order-service-apm-server-ca
        - name: apm-truststore
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: supermarket-demo
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 3000
      targetPort: http
---
