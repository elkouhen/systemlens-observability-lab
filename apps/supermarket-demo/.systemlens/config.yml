include:
- '**/*'
exclude:
- .git/**
- .venv/**
- node_modules/**
- .systemlens/**
min_severity: INFO
root_path: .
analysis:
  strategy: default
  disabled_extractors: []
  call_graph_engine: source
runtime:
  service_map:
    supermarket-order: order-service
  ignore_services:
    - elastic-otel-collector
    - otel-edge
