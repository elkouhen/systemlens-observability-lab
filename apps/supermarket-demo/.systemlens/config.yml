include:
- '**/*'
exclude:
- .git/**
- .venv/**
- node_modules/**
- .systemlens/**
min_severity: INFO
root_path: .
analysis:
  strategy: default
  codeql: true
  call_graph_engine: codeql
  codeql_timeout_seconds: 100
  codeql_threads: 0
  codeql_ram_mb: null
  codeql_verbosity: null
  codeql_max_hops: 12
  disabled_extractors: []
