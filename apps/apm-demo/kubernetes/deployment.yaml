apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-demo
  namespace: apm-demo
spec:
  replicas: 1
  # Le cluster k3d du POC ne dispose que d'un nœud à 2 vCPU : remplacer le
  # pod plutôt que créer un surge évite un rollout bloqué. En production,
  # conserver le surge avec plusieurs replicas et une capacité réservée.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-demo
    spec:
      containers:
        - name: apm-demo
          image: apm-demo:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: OTEL_SERVICE_NAME
              value: apm-demo
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: DEPLOYMENT_ENVIRONMENT
              value: local
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=apm-demo,service.version=1.0.0,deployment.environment.name=local
            # Le Java agent ajoute trace_id/span_id au MDC Logback. L'encodeur
            # ECS les sérialise en trace.id/span.id pour la navigation log-trace.
            - name: OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-gateway.elastic-stack.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # Les logs ECS sont collectés sur stdout par Elastic Agent : éviter
            # l'export OTLP Logs, dont le gateway n'expose pas de pipeline logs.
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: http://otel-collector-gateway.elastic-stack.svc:4318/v1/metrics
            - name: APM_DEMO_WORKER_URL
              value: http://apm-demo-worker:3001
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.33.10:9092,192.168.33.11:9092,192.168.33.12:9092
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-demo-worker
  namespace: apm-demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-demo-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-demo-worker
    spec:
      containers:
        - name: apm-demo-worker
          image: apm-demo-worker:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: OTEL_SERVICE_NAME
              value: apm-demo-worker
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: DEPLOYMENT_ENVIRONMENT
              value: local
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=apm-demo,service.version=1.0.0,deployment.environment.name=local
            - name: OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-gateway.elastic-stack.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: http://otel-collector-gateway.elastic-stack.svc:4318/v1/metrics
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://192.168.33.10:27017,192.168.33.11:27017,192.168.33.12:27017/observability_test?replicaSet=poc-rs
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://192.168.33.10:5432/observability_test
            - name: SPRING_DATASOURCE_USERNAME
              value: observability
            # Identifiants de démonstration uniquement ; remplacer par un Secret
            # Kubernetes dans un environnement non éphémère.
            - name: SPRING_DATASOURCE_PASSWORD
              value: poc-postgresql-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.33.10:9092,192.168.33.11:9092,192.168.33.12:9092
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apm-demo-worker
  namespace: apm-demo
spec:
  selector:
    app.kubernetes.io/name: apm-demo-worker
  ports:
    - name: http
      port: 3001
      targetPort: http
